<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>자키 라이더</title>
<style>
  :root{
    --ink:#3B2A1C;
    --ink-soft:#8A6E56;
    --paper:rgba(255,250,242,.88);
    --line:rgba(59,42,28,.18);
    --haz:#F5C400;
    --hot:#D9472B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#F3DDC0;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);touch-action:none;overscroll-behavior:none;user-select:none}
  #app{position:fixed;inset:0;opacity:0;transition:opacity .45s ease}
  body.scene-ready #app{opacity:1}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  #hud.on{opacity:1}
  .haz{background:repeating-linear-gradient(135deg,var(--haz) 0 10px,#2A2118 10px 20px)}

  .speedbox{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));
    background:var(--paper);padding:8px 14px 10px;border-top:6px solid transparent;
    box-shadow:0 8px 24px rgba(59,42,28,.18)}
  .speedbox::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 9px,#2A2118 9px 18px)}
  .spd{font-size:58px;line-height:.9;font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
  .spd small{font-size:14px;font-weight:800;letter-spacing:0;color:var(--ink-soft);margin-left:4px}
  .tip{margin-top:9px;height:10px;width:160px;background:rgba(59,42,28,.12);position:relative;overflow:hidden}
  .tip i{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:repeating-linear-gradient(135deg,var(--haz) 0 8px,#2A2118 8px 16px);transition:width .06s linear}
  .tip.danger i{background:repeating-linear-gradient(135deg,var(--hot) 0 8px,#2A2118 8px 16px)}
  .pow{margin-top:6px;height:10px;width:160px;background:rgba(59,42,28,.12);position:relative;overflow:hidden;display:none}
  .pow.on{display:block}
  .pow i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#FF3B2F;box-shadow:0 0 10px #FF3B2F;transition:width .06s linear}

  .distbox{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
    text-align:right;background:var(--paper);padding:8px 14px 10px;box-shadow:0 8px 24px rgba(59,42,28,.18)}
  .distbox::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 9px,#2A2118 9px 18px)}
  .dist{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
  .dist small{font-size:12px;font-weight:800;color:var(--ink-soft);margin-left:2px}
  .lives{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
  .lives b{width:16px;height:12px;border-radius:8px 8px 2px 2px;background:var(--haz);
    box-shadow:inset 0 -3px 0 rgba(59,42,28,.35);transition:all .25s}
  .lives b.off{background:rgba(59,42,28,.15);box-shadow:none}
  .pal{margin-top:7px;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .pal b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}

  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 55%,rgba(217,71,43,0) 35%,rgba(217,71,43,.55) 100%)}
  #flash.shield{background:radial-gradient(circle at 50% 55%,rgba(159,190,56,0) 40%,rgba(159,190,56,.5) 100%)}
  #boostfx{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 60%,rgba(255,255,255,0) 40%,rgba(245,196,0,.45) 100%)}

  /* ---------- 스틱 ---------- */
  #stick{position:fixed;width:118px;height:118px;margin:-59px 0 0 -59px;pointer-events:none;
    opacity:0;transition:opacity .12s}
  #stick.on{opacity:1}
  #stick .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,250,242,.95);
    background:rgba(59,42,28,.12);box-shadow:0 6px 22px rgba(59,42,28,.22)}
  #stick .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
    border-radius:50%;background:var(--haz);box-shadow:0 4px 12px rgba(59,42,28,.35),inset 0 -4px 0 rgba(59,42,28,.25)}

  /* ---------- 오버레이 ---------- */
  .sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(243,221,192,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .sheet.hide{display:none}
  .card{width:min(430px,100%);background:var(--paper);padding:28px 28px 26px;position:relative;
    box-shadow:0 26px 60px rgba(59,42,28,.25)}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 12px,#2A2118 12px 24px)}
  .title{font-size:54px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:8px}
  .sub{margin-top:10px;color:var(--ink-soft);font-size:15px;line-height:1.65}
  .keys{margin-top:20px;display:flex;flex-direction:column;gap:9px}
  .keys div{display:flex;gap:12px;align-items:baseline;font-size:14.5px}
  .keys span{flex:0 0 92px;font-weight:800;color:var(--ink)}
  .keys em{font-style:normal;color:var(--ink-soft)}
  button{pointer-events:auto;margin-top:24px;width:100%;border:0;padding:17px;
    font-size:18px;font-weight:900;letter-spacing:-.02em;color:#2A2118;background:var(--haz);
    box-shadow:inset 0 -5px 0 rgba(59,42,28,.3);font-family:inherit;cursor:pointer;transition:transform .08s}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .stats{margin-top:22px;display:flex;gap:10px}
  .stats div{flex:1;background:rgba(255,255,255,.7);padding:14px 12px 12px;box-shadow:inset 0 0 0 1px var(--line)}
  .stats b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .stats i{font-style:normal;font-size:11.5px;color:var(--ink-soft);font-weight:800;white-space:nowrap}

  .rank{display:none;margin-top:16px;gap:8px}
  .rank.on{display:flex}
  .rank input{flex:1;min-width:0;border:0;padding:14px;font-size:16px;font-family:inherit;color:var(--ink);
    background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
  .rank input:focus{outline:2px solid var(--haz)}
  .rank button{margin-top:0;width:auto;padding:14px 20px}
  .rank button[disabled]{opacity:.5}
  .rankmsg{margin-top:8px;font-size:13px;font-weight:700;color:var(--ink-soft);min-height:1em}
  .board{margin-top:6px;max-height:190px;overflow:auto}
  .board table{width:100%;border-collapse:collapse;font-size:13.5px}
  .board td{padding:6px 6px;border-bottom:1px solid var(--line)}
  .board td:first-child{width:26px;color:var(--ink-soft);font-weight:800}
  .board td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  
  
  
/* ---------- 인트로 포스터 ---------- */
.poster{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,214,120,.22), rgba(255,214,120,0) 34%),
    linear-gradient(180deg, rgba(85,43,99,.18), rgba(243,221,192,0) 45%);
}
.poster.hide{display:none}

.poster .frame{
  position:absolute;
  inset:10px;
  border:3px solid rgba(58,15,15,.55);
  outline:2px solid rgba(255,214,77,.55);
  outline-offset:-9px;
  pointer-events:none;
}

.heroHead{
  position:absolute;
  left:0; right:0;
  top:calc(24px + env(safe-area-inset-top));
  text-align:center;
  padding:0 18px;
}

.heroHead .ko{
  font-size:min(15vw,108px);
  font-weight:900;
  letter-spacing:-.05em;
  line-height:1;
  background:linear-gradient(180deg,#FFF7D7 0%,#FFD75B 28%,#FF8748 54%,#FFE3A6 78%,#FFF7D7 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:
    drop-shadow(3px 0 0 #351116)
    drop-shadow(-3px 0 0 #351116)
    drop-shadow(0 3px 0 #351116)
    drop-shadow(0 -3px 0 #351116)
    drop-shadow(0 8px 14px rgba(53,17,22,.30));
}



.heroBottom{
  position:absolute;
  left:0; right:0;
  bottom:calc(34px + env(safe-area-inset-bottom));
  text-align:center;
}

.startBtn{
  pointer-events:auto;
  display:inline-block;
  width:auto;
  margin:0;
  padding:16px 34px;
  border:0;
  border-radius:999px;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.03em;
  color:#2A2118;
  background:linear-gradient(180deg,#FFE37A 0%, #F5C400 100%);
  box-shadow:
    0 10px 24px rgba(59,42,28,.24),
    inset 0 -5px 0 rgba(59,42,28,.22);
  font-family:inherit;
  cursor:pointer;
}

.startBtn:active{transform:translateY(2px)}
  .startBtn:disabled{opacity:.58;cursor:default;filter:saturate(.45);transform:none}

.startHint{
  margin-top:12px;
  font-size:13px;
  font-weight:800;
  color:rgba(59,42,28,.78);
  letter-spacing:.02em;
}

.pkeys{
  position:absolute;
  left:calc(18px + env(safe-area-inset-left));
  bottom:calc(30px + env(safe-area-inset-bottom));
  background:rgba(255,250,242,.82);
  padding:10px 12px;
  font-size:12.5px;
  line-height:1.55;
  color:var(--ink);
  box-shadow:0 8px 24px rgba(59,42,28,.18);
}

.pkeys div{display:flex;gap:10px}
.pkeys span{flex:0 0 58px;font-weight:800}
.pkeys em{font-style:normal;color:var(--ink-soft)}

@media (max-width:640px){
  .heroBottom{bottom:calc(20px + env(safe-area-inset-bottom))}
  .pkeys{
    left:50%;
    transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom));
    width:min(92vw,360px);
    font-size:12px;
  }
  .pkeys div{gap:8px}
}


  @media (prefers-reduced-motion:reduce){ .press{animation:none} }
  #sound,#pause{position:fixed;right:calc(14px + env(safe-area-inset-right));
    width:44px;height:44px;margin:0;padding:0;border:0;border-radius:0;background:var(--paper);color:var(--ink);
    box-shadow:0 6px 18px rgba(59,42,28,.2);display:flex;align-items:center;justify-content:center;
    font-size:19px;pointer-events:auto;cursor:pointer;z-index:25}
  #sound{bottom:calc(14px + env(safe-area-inset-bottom))}
  #pause{bottom:calc(66px + env(safe-area-inset-bottom));display:none;font-size:17px}
  body.game-on #pause{display:flex}
  #pause.paused{background:#2f3d38;color:#fff3c7;box-shadow:0 0 0 2px rgba(255,243,199,.25),0 6px 18px rgba(0,0,0,.28)}

  @media (max-width:420px){ .spd{font-size:46px} .title{font-size:44px} .tip,.pow{width:130px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }


  /* ---------- 스토리 엔딩: 설명 없이 풍경과 다시하기만 남긴다 ---------- */
  #ending{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;
    padding:0 20px calc(30px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(3,5,4,0) 48%,rgba(3,5,4,.08) 68%,rgba(3,5,4,.58) 100%);
    transition:opacity 1.7s ease}
  #ending.hide{display:none}
  #ending.show{display:flex;opacity:1;pointer-events:auto}
  #ending .endInner{text-align:center;width:min(420px,90vw)}
  #ending button{width:auto;min-width:150px;margin:0;padding:14px 30px;border-radius:999px;
    background:#d7bc75;color:#211c16;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.32)}

</style>
</head>
<body>
<!-- 화면 문구는 아래 hud / intro / over 세 블록 안에만 있습니다 -->
<div id="app"></div>

<div id="hud">
  <div class="speedbox">
    <div class="spd"><span id="spd">0</span><small>km/h</small></div>
    <div class="tip" id="tip"><i></i></div>
    <div class="pow" id="pow"><i></i></div>
  </div>
  <div class="distbox">
    <div class="dist"><span id="dist">0</span><small>m</small></div>
    <div class="lives" id="lives"></div>
    <div class="pal"><b id="pal">0</b>단</div>
  </div>
</div>

<div id="stick"><div class="ring"></div><div class="nub" id="nub"></div></div>
<div id="flash"></div>
<div id="boostfx"></div>
<button id="pause" type="button" aria-label="일시정지">Ⅱ</button>
<div id="sound">♪</div>



<div class="poster" id="intro">
  <div class="frame"></div>

<div class="heroHead">
  <div class="ko" data-t="자키 라이더">자키 라이더</div>
</div>

  <div class="heroBottom">
    <button id="go" class="startBtn" type="button" disabled>장면 준비 중…</button>
    <div class="startHint">터치 · 클릭 · Enter · Space</div>
  </div>

   <div class="pkeys">
    <div><span>조향</span><em>좌우로 끌기 · ← →</em></div>
    <div><span>점프</span><em>아래로 당겼다 놓기 · ↓ / Space</em></div>
    <div><span>발 구르기</span><em>짧게 탭 · Space 짧게</em></div>
  </div>
</div>


<div class="sheet hide" id="over">
  <div class="card">
    <div class="title" id="overTitle">기록</div>
    <div class="stats">
      <div><b id="rDist">0</b><i>거리 m</i></div>
      <div><b id="rPal">0</b><i>최고 적재 단</i></div>
      <div><b id="rBest">0</b><i>최고기록 m</i></div>
    </div>
    <div class="rank" id="rank">
      <input id="nick" maxlength="12" placeholder="닉네임" autocomplete="off">
      <button id="submit" type="button">등록</button>
    </div>
    <div class="rankmsg" id="rankmsg"></div>
    <div class="board" id="board"></div>
    <button id="again">다시</button>
  </div>
</div>

<div id="ending" class="hide">
  <div class="endInner">
    <button id="endAgain" type="button">다시</button>
  </div>
</div>

<script>

// 현재 도로 격자(가로 2.5, 세로 1.25)에 맞춰 바닥 무늬를 붙인다.
function roadPaint(batch,outline,color,lift=.035){
  const dx=2.5,dz=1.25;
  const edge=(a,b,p)=>
    (b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);

  function cut(poly,a,b){
    const out=[];
    if(!poly.length)return out;

    let prev=poly[poly.length-1],pd=edge(a,b,prev);

    for(const p of poly){
      const d=edge(a,b,p);

      if((d<=0)!==(pd<=0)){
        const t=pd/(pd-d);
        out.push([
          mix(prev[0],p[0],t),
          mix(prev[1],p[1],t)
        ]);
      }

      if(d<=0)out.push(p);
      prev=p;
      pd=d;
    }

    return out;
  }

  const xs=outline.map(p=>p[0]),zs=outline.map(p=>p[1]);
  const minX=Math.floor(Math.min(...xs)/dx)*dx;
  const maxX=Math.max(...xs);
  const minZ=Math.floor(Math.min(...zs)/dz)*dz;
  const maxZ=Math.max(...zs);
  const col=rgb(color);

  for(let x=minX;x<maxX;x+=dx){
    for(let z=minZ;z<maxZ;z+=dz){
      const a=[x,z],b=[x,z+dz];
      const c=[x+dx,z+dz],d=[x+dx,z];

      for(const tri of [[a,b,d],[b,c,d]]){
        let poly=outline;

        for(let k=0;k<3;k++){
          poly=cut(poly,tri[k],tri[(k+1)%3]);
        }

        if(poly.length<3)continue;

        const [A,B,C]=tri,area=edge(A,B,C);
        const ya=H(...A),yb=H(...B),yc=H(...C);

        const v=poly.map(p=>[
          p[0],
          (
            edge(B,C,p)*ya+
            edge(C,A,p)*yb+
            edge(A,B,p)*yc
          )/area+lift,
          p[1]
        ]);

        for(let k=1;k<v.length-1;k++){
          if(Math.abs(edge(poly[0],poly[k],poly[k+1]))<1e-9){
            continue;
          }

          batch.tri(v[0],v[k],v[k+1],col);
        }
      }
    }
  }
}

    );

  const clamp01=v=>
    Math.max(
      0,
      Math.min(1,v)
    );

  const rust=
    clamp01(
      Number(opt.rust)||0
    );

  const damage=
    clamp01(
      opt.damage!=null
        ? Number(opt.damage)||0
        : rust*.58
    );

  const detail=
    opt.detail===0
      ? 0
      : opt.detail===2
        ? 2
        : 1;

  // 위치를 기준으로 고정된 변화값을 만든다.
  // 재실행 때 컨테이너 외형이 마구 바뀌지 않는다.
  const seed=
    Number.isFinite(opt.seed)
      ? opt.seed
      : Math.abs(
          Math.sin(
            center[0]*12.9898+
            center[2]*78.233+
            color*.000013+
            len*4.17
          )*
          43758.5453
        );

  const rnd=n=>{
    const x=
      Math.sin(
        seed*17.13+
        n*91.71
      )*
      43758.5453;

    return x-
      Math.floor(x);
  };

  const paint=
    shade(
      color,
      .92+
      rnd(1)*.07
    );

  const dark=
    shade(
      paint,
      .54
    );

  const edge=
    shade(
      paint,
      .64
    );

  const rib=
    shade(
      paint,
      .80
    );

  const recess=
    shade(
      paint,
      .72
    );

  const faded=
    shade(
      paint,
      1.08
    );

  const grime=
    0x353734;

  const rustDark=
    0x593726;

  const rustLight=
    0x78452d;


  // ─────────────────────────────
  // 1. 본체
  // ─────────────────────────────

  mbox(
    b,
    center,
    [
      w,
      h,
      len
    ],
    paint,
    m
  );


  // ─────────────────────────────
  // 2. 옆면 골과 판넬 음영
  // ─────────────────────────────

  const step=.92;

  const n=Math.max(
    1,
    Math.floor(
      (len-.7)/
      step
    )
  );

  for(let k=0;k<=n;k++){
    const dz=
      -len/2+
      .35+
      k*step;

    for(const side of[-1,1]){
      mbox(
        b,
        r(
          side*
          (
            w/2+
            .018
          ),
          0,
          dz
        ),
        [
          .045,
          h*.88,
          .17
        ],
        rib,
        m
      );
    }
  }


  // 골 사이의 판넬 색을 미세하게 달리해
  // 옆면이 한 장짜리 평면처럼 보이지 않게 한다.
  if(detail>0){
    for(const side of[-1,1]){
      for(let k=0;k<n;k+=2){
        const dz=
          -len/2+
          .82+
          k*step;

        const tone=
          k%4===0
            ? recess
            : shade(
                paint,
                .86
              );

        mbox(
          b,
          r(
            side*
            (
              w/2+
              .026
            ),
            -.02+
            (
              rnd(
                20+
                k+
                (
                  side>0
                    ? 100
                    : 0
                )
              )-.5
            )*.05,
            dz
          ),
          [
            .024,
            h*.69,
            Math.min(
              step*1.42,
              len*.18
            )
          ],
          tone,
          m
        );
      }
    }
  }


  // ─────────────────────────────
  // 3. 모서리 프레임과 레일
  // ─────────────────────────────

  for(const sx of[-1,1]){
    for(const sz of[-1,1]){
      mbox(
        b,
        r(
          sx*w/2,
          0,
          sz*len/2
        ),
        [
          .17,
          h+.05,
          .17
        ],
        dark,
        m
      );
    }
  }

  for(const sx of[-1,1]){
    for(const sy of[-1,1]){
      mbox(
        b,
        r(
          sx*w/2,
          sy*h/2,
          0
        ),
        [
          .13,
          .13,
          len+.02
        ],
        edge,
        m
      );
    }
  }

  for(const sz of[-1,1]){
    for(const sy of[-1,1]){
      mbox(
        b,
        r(
          0,
          sy*h/2,
          sz*len/2
        ),
        [
          w+.02,
          .13,
          .13
        ],
        edge,
        m
      );
    }
  }


  // 실제 컨테이너 모서리의 주물 블록.
  for(const sx of[-1,1]){
    for(const sy of[-1,1]){
      for(const sz of[-1,1]){
        mbox(
          b,
          r(
            sx*w/2,
            sy*h/2,
            sz*len/2
          ),
          [
            .25,
            .25,
            .25
          ],
          0x343936,
          m
        );
      }
    }
  }


  // ─────────────────────────────
  // 4. 지붕과 문 반대쪽 끝면
  // ─────────────────────────────

  if(detail>0){
    // 지붕의 가로 이음선.
    for(
      let z=
        -len/2+
        .65;
      z<
        len/2-
        .55;
      z+=1.35
    ){
      mbox(
        b,
        r(
          0,
          h/2+.027,
          z
        ),
        [
          w-.23,
          .035,
          .085
        ],
        shade(
          paint,
          .69
        ),
        m
      );
    }


    // 문이 없는 반대편 끝면의 골.
    for(
      let x=
        -w/2+
        .31;
      x<
        w/2-
        .20;
      x+=.37
    ){
      mbox(
        b,
        r(
          x,
          0,
          -len/2-
          .028
        ),
        [
          .10,
          h*.80,
          .035
        ],
        rib,
        m
      );
    }
  }


  // ─────────────────────────────
  // 5. 바닥 때와 바랜 표식
  // ─────────────────────────────

  if(detail>0){
    for(const side of[-1,1]){
      // 바닥 근처의 먼지와 물때.
      mbox(
        b,
        r(
          side*
          (
            w/2+
            .033
          ),
          -h*.39,
          (
            rnd(
              60+
              side
            )-.5
          )*
          len*.12
        ),
        [
          .025,
          .30+
          rnd(
            61+
            side
          )*.15,
          len*
          (
            .54+
            rnd(
              62+
              side
            )*.23
          )
        ],
        grime,
        m
      );
    }


    // 페인트가 바랜 회사명 자리처럼 보이는 직사각형.
    const markSide=
      rnd(70)<.5
        ? -1
        : 1;

    const markZ=
      -len*.10+
      (
        rnd(71)-.5
      )*
      len*.32;

    mbox(
      b,
      r(
        markSide*
        (
          w/2+
          .042
        ),
        h*.12,
        markZ
      ),
      [
        .024,
        .34,
        Math.min(
          2.30,
          len*.32
        )
      ],
      shade(
        faded,
        .88
      ),
      m
    );


    // 표식 위에 남은 어두운 획.
    mbox(
      b,
      r(
        markSide*
        (
          w/2+
          .048
        ),
        h*.12,
        markZ
      ),
      [
        .018,
        .075,
        Math.min(
          1.42,
          len*.21
        )
      ],
      shade(
        paint,
        .47
      ),
      m
    );
  }


  // 찌그러진 부분을 실제 곡면 대신
  // 얕은 어두운 패치와 비뚤어진 골로 표현한다.
  if(
    detail>0&&
    damage>.28
  ){
    const dents=
      1+
      Math.round(
        damage*2
      );

    for(let i=0;i<dents;i++){
      const side=
        rnd(
          80+i
        )<.5
          ? -1
          : 1;

      const z=
        -len*.34+
        rnd(
          90+i
        )*
        len*.68;

      const y=
        -h*.15+
        rnd(
          100+i
        )*
        h*.34;

      mbox(
        b,
        r(
          side*
          (
            w/2+
            .046
          ),
          y,
          z
        ),
        [
          .024,
          .38+
          rnd(
            110+i
          )*.38,
          .72+
          rnd(
            120+i
          )*.82
        ],
        shade(
          paint,
          .48
        ),
        m
      );

      mbox(
        b,
        r(
          side*
          (
            w/2+
            .052
          ),
          y+
          .06,
          z+
          .08
        ),
        [
          .018,
          .07,
          .58+
          rnd(
            130+i
          )*.46
        ],
        shade(
          paint,
          1.03
        ),
        m
      );
    }
  }


  // ─────────────────────────────
  // 6. 문
  // ─────────────────────────────

  function drawDoorLeaf(
    c,
    dm,
    side,
    doorSeed
  ){
    const leafW=
      w/2-
      .07;

    const leafH=
      h-
      .16;

    const rr=(x,y,z)=>
      tb(
        c,
        dm,
        x,y,z
      );

    // 문짝 본체.
    mbox(
      b,
      c,
      [
        leafW,
        leafH,
        .065
      ],
      shade(
        paint,
        .75
      ),
      dm
    );


    // 문짝 테두리.
    for(const sx of[-1,1]){
      mbox(
        b,
        rr(
          sx*
          (
            leafW/2-
            .025
          ),
          0,
          .054
        ),
        [
          .055,
          leafH-.04,
          .045
        ],
        dark,
        dm
      );
    }

    for(const sy of[-1,1]){
      mbox(
        b,
        rr(
          0,
          sy*
          (
            leafH/2-
            .025
          ),
          .054
        ),
        [
          leafW-.04,
          .055,
          .045
        ],
        dark,
        dm
      );
    }


    // 잠금바 두 개.
    for(const dx of[
      -.28,
      .28
    ]){
      mbox(
        b,
        rr(
          dx,
          0,
          .084
        ),
        [
          .052,
          leafH-.42,
          .052
        ],
        0x343a38,
        dm
      );

      // 잠금바 손잡이.
      mbox(
        b,
        rr(
          dx+
          (
            side<0
              ? .07
              : -.07
          ),
          -.23,
          .115
        ),
        [
          .23,
          .055,
          .055
        ],
        0x303634,
        dm
      );
    }


    // 바깥쪽 경첩 네 개.
    const hingeX=
      side*
      (
        leafW/2-
        .025
      );

    for(const yy of[
      -.78,
      -.27,
      .27,
      .78
    ]){
      mbox(
        b,
        rr(
          hingeX,
          yy,
          .082
        ),
        [
          .12,
          .16,
          .10
        ],
        0x303634,
        dm
      );
    }


    // 한쪽 문에만 작은 식별판.
    if(
      detail>0&&
      doorSeed%2===0
    ){
      mbox(
        b,
        rr(
          -side*.12,
          -.55,
          .102
        ),
        [
          .42,
          .25,
          .025
        ],
        0xb7b39f,
        dm
      );

      mbox(
        b,
        rr(
          -side*.12,
          -.55,
          .118
        ),
        [
          .25,
          .045,
          .018
        ],
        0x3f4542,
        dm
      );
    }
  }


  const doors=
    opt.doors||
    'closed';

  if(doors==='closed'){
    for(const side of[-1,1]){
      drawDoorLeaf(
        r(
          side*w/4,
          0,
          len/2+
          .045
        ),
        m,
        side,
        Math.floor(
          seed+
          side*11
        )
      );
    }
  }else{
    // 내부가 단순 검은 페인트 판이 아니라
    // 컨테이너 내부의 깊은 그늘처럼 보이게 한다.
    mbox(
      b,
      r(
        0,
        0,
        len/2-
        .16
      ),
      [
        w-.20,
        h-.20,
        .28
      ],
      0x111514,
      m
    );

    mbox(
      b,
      r(
        0,
        -.38,
        len/2-
        .35
      ),
      [
        w-.34,
        .05,
        .40
      ],
      0x2c302e,
      m
    );


    if(doors==='open'){
      const a=
        opt.doorAngle!=null
          ? opt.doorAngle
          : 1.85;

      for(const side of[-1,1]){
        const th=
          side*a;

        const dm=
          mulBasis(
            m,
            th
          );

        const hinge=
          r(
            side*w/2,
            0,
            len/2+
            .04
          );

        const c=
          tb(
            hinge,
            dm,
            -side*w/4,
            0,
            0
          );

        drawDoorLeaf(
          c,
          dm,
          side,
          Math.floor(
            seed+
            side*19
          )
        );
      }
    }
  }


  // ─────────────────────────────
  // 7. 녹과 빗물 자국
  // ─────────────────────────────

  if(rust>0){
    const count=
      2+
      Math.round(
        rust*7
      );

    for(let i=0;i<count;i++){
      const side=
        rnd(
          160+i
        )<.5
          ? -1
          : 1;

      const z=
        -len/2+
        .75+
        rnd(
          180+i
        )*
        Math.max(
          .2,
          len-1.5
        );

      const streakH=
        .45+
        rnd(
          200+i
        )*
        (
          .65+
          rust*1.05
        );

      const y=
        h*.34-
        streakH*.5-
        rnd(
          220+i
        )*
        h*.42;

      mbox(
        b,
        r(
          side*
          (
            w/2+
            .058
          ),
          y,
          z
        ),
        [
          .025,
          streakH,
          .12+
          rnd(
            240+i
          )*.24
        ],
        i%3
          ? rustDark
          : rustLight,
        m
      );

      if(i%3===0){
        mbox(
          b,
          r(
            side*
            (
              w/2+
              .060
            ),
            -h*.43,
            z+
            .12
          ),
          [
            .024,
            .13,
            .55+
            rnd(
              260+i
            )*.72
          ],
          rustDark,
          m
        );
      }
    }


    // 문쪽 상단에서 아래로 내려온 긴 녹물.
    if(rust>.48){
      for(const x of[
        -w*.27,
        w*.24
      ]){
        mbox(
          b,
          r(
            x,
            .18,
            len/2+
            .134
          ),
          [
            .12+
            rust*.06,
            .72+
            rust*.70,
            .025
          ],
          rustDark,
          m
        );
      }
    }
  }


  // ─────────────────────────────
  // 8. 내부 화물
  // ─────────────────────────────

  if(opt.cargo==='pallets'){
    for(let i=0;i<3;i++){
      drawPalletDecor(
        b,
        r(
          (i-1)*.02,
          -h/2+
          .02+
          i*.155,
          len/2-
          1.3
        ),
        m,
        i%2
          ? 'aj'
          : 'kpp'
      );
    }
  }

  if(opt.cargo==='boxes'){
    mbox(
      b,
      r(
        -.50,
        -h/2+.45,
        len/2-1.20
      ),
      [
        1.0,.9,1.0
      ],
      0x967750,
      m
    );

    mbox(
      b,
      r(
        .55,
        -h/2+.35,
        len/2-1.60
      ),
      [
        .9,.7,.9
      ],
      0x8a6d4a,
      m
    );

    mbox(
      b,
      r(
        -.30,
        -h/2+1.30,
        len/2-1.35
      ),
      [
        .8,.6,.8
      ],
      0x9a7c55,
      m
    );
  }
}



// 풍경용 파렛트 (죽은 색). center = 바닥 중심
function drawPalletDecor(b,center,m=IDENT,kind='aj'){
 const c=PAL_DECOR[kind]||PAL_DECOR.aj,r=(x,y,z)=>tb(center,m,x,y,z);
 mbox(b,r(0,.13,0),[1.1,.04,1.1],c.deck,m);
 for(const x of[-.44,0,.44])mbox(b,r(x,.05,0),[.16,.09,1.1],c.foot,m);
 for(let i=0;i<5;i++)mbox(b,r(0,.155,-.44+i*.22),[1.1,.012,.08],shade(c.deck,.72),m);
}
// 트랙터(캡) — 길이 5.4, 캡이 +z. center = 바닥 중심
function drawTractor(b,center,m=IDENT,paint=0x6c7a80){
 const r=(x,y,z)=>tb(center,m,x,y,z);
 mbox(b,r(0,.75,-.3),[2.4,.28,5.4],0x2e3533,m);
 for(const dz of[-2.0,-.9,1.7])for(const dx of[-1.08,1.08])mbox(b,r(dx,.55,dz),[.36,1.1,1.1],0x232826,m);
 mbox(b,r(0,2.05,1.6),[2.4,2.6,2.4],paint,m);mbox(b,r(0,2.45,2.83),[2.1,1.05,.08],0x8fa2ad,m);
 mbox(b,r(0,3.55,1.4),[2.3,.45,1.9],shade(paint,.85),m);mbox(b,r(0,.95,2.95),[2.4,.5,.4],0x2e3533,m);
 mbox(b,r(0,1.15,-1.8),[1.6,.2,1.6],0x3b423f,m);

// 트레일러 섀시 — 길이 12.2, 바퀴는 -z 쪽. opt.container(색)이 있으면 컨테이너를 얹음
function drawTrailer(b,center,m=IDENT,opt={}){

 mbox(b,r(0,1.2,0),[2.45,.32,len],0x2e3533,m);

 for(const dx of[-.9,.9])mbox(b,r(dx,.6,len/2-2.4),[.12,1.1,.12],0x3b423f,m);

}
// 끊어진 고정끈: 점들을 잇는 얇은 띠

// ---- 삽입 구간 랜드마크 좌표 (월드) ----
const CG_A=INSERTS[0].at,CG_B=CG_A+INSERTS[0].len;                 // 1414~2194 컨테이너 이상징후 → 미니 밭 → 벽 → 공동묘지
const CG_FIELD_A=CG_A+236,CG_FIELD_B=CG_A+380,CG_REVEAL=CG_A+402,CG_WALL=CG_A+470,CG_GRAVE_A=CG_A+482,CG_GRAVE_B=CG_A+742;
const SF_A=wz(INSERTS[1].at)-INSERTS[1].len,SF_B=SF_A+INSERTS[1].len; // 6904~7364 해상 유실 화물지대

const SF_SPILL=SF_A+10,SF_FIELD_A=SF_A+34,SF_FIELD_B=SF_A+260,SF_REVEAL=SF_A+310,SF_STRUCT=SF_A+420;



const SF_WATER_DROP=6.9;  // 도로 기준면 아래 검은 물 수면 깊이 (게임 쪽 H()의 cargoBay 밴드와 맞춤)

// 삽입 구간은 월드 좌표로 직접 만든다 (Hw, cxw = 월드 좌표 지형 함수)
function buildInsertedWorld(Hw,cxw,seed=0){

 const cx=cxw,Y=Hw,base=z=>Hw(cxw(z),z),ground=(u,z)=>{const x=cx(z)+u;return[x,Y(x,z),z];};

/* 시드: ?seed=숫자 로 코스를 바꾼다. ?daily=1 이면 날짜(KST) 기준으로 전원 같은 판 */
const SEED=(function(){ try{ const q=new URLSearchParams(location.search);
  if(q.get("daily")) return Math.floor((Date.now()+9*3600e3)/86400e3)%100000;
  return parseInt(q.get("seed")||"0",10)||0; }catch(e){ return 0; } })();
const SP=SEED*1.37;                              // 지형 위상 오프셋

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}

function difficultyAt(z){
  return smooth((z-EASY_END)/(HARD_AT-EASY_END));
}

// 자연지형 울퉁불퉁함
function roughnessAt(z){
  return smooth((z-260)/850);
}

// 좌우 차로별 낙차
function laneDifficultyAt(z){
  return smooth((z-340)/850);
}

// 인공 도약대
function kickerStrengthAt(z){
  return smooth((z-500)/650);
}



function smoother(t){t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash1(n){const v=Math.sin(n*127.1+311.7+SEED*0.731)*43758.5453;return v-Math.floor(v);}
function ihash(n){ n=(n^61)^(n>>>16); n=Math.imul(n,9)>>>0; n=(n^(n>>>4))>>>0; n=Math.imul(n,0x27d4eb2d)>>>0; n=(n^(n>>>15))>>>0; return n/4294967296; }

function curveAmp(z){
  // 초반은 거의 직선.
  // 180m 이후부터 서서히 현재 수준까지 굽어진다.
  return 0.04 + 0.96*smooth((z-180)/(CURVE_Z-180));
}




function cx(z){ return curveAmp(z)*(18*Math.sin(z*0.0060+SP) + 7*Math.sin(z*0.0140+1.7+SP)); }
function cxSlope(z){ return cx(z+0.5)-cx(z-0.5); }
/* ---- 기본 경사의 누적 낙차: 경사가 B0→B1 로 서서히 오른다 ---- */
function baseDrop(z){
  if(z<=0) return z*B0;
  if(z>=RAMP_Z) return B0*RAMP_Z+(B1-B0)*RAMP_Z*0.5+B1*(z-RAMP_Z);
  const t=z/RAMP_Z;
  return B0*z+(B1-B0)*RAMP_Z*(t*t*t-t*t*t*t*0.5);
}
function segDrop(n){ return D0+(D1-D0)*smooth((n*SEG)/RAMP_Z); }
const dropPrefix=[0];
function dropBefore(n){
  if(n<=0) return n*D0;
  while(dropPrefix.length<=n) dropPrefix.push(dropPrefix[dropPrefix.length-1]+segDrop(dropPrefix.length-1));
  return dropPrefix[n];
}

/* ---- 지형 높이 ---- */
function steepLane(z){ return ((z%SEG)+SEG)%SEG < SEG*0.5 ? 0 : 1; }   // 0=왼쪽 차로, 1=오른쪽 차로
function laneW(u){ return smooth((u+MED+4.7)/((MED+4.7)*2)); }        // 중앙 ±6m 안에서 완만히 전환
function cumDrop(z,phase){
  const n=Math.floor(z/SEG), p=(z-n*SEG)/SEG;
  return dropBefore(n) + segDrop(n)*smoother((p-phase)/0.5);
}




function hills(x,z){
  const a=roughnessAt(z);

  return a*(
      2.20*Math.sin(z*0.0210+x*0.0060+SP)
    + 1.40*Math.sin(x*0.0220-z*0.0170+1.3+SP)
    + 0.75*Math.sin(z*0.0700+x*0.0140+SP*0.5)
    + 0.40*Math.sin(x*0.0500+z*0.0450+2.1)
  );
}




/* 융기: 40m마다 하나, 그때 가파른 차로에 솟은 아스팔트 (도약대) */
function kickerAt(k){
  const kz=k*40+9+hash1(k)*22;
  const ku=(steepLane(kz)?1:-1)*(3.2+hash1(k+91.3)*5.5);
  return {u:ku,z:kz};
}
function kicker(u,z){
  const n=Math.floor(z/40); let s=0;
  for(let k=n-1;k<=n+1;k++){
    if(k<12) continue;
    const kk=kickerAt(k);
    const du=u-kk.u, dz=z-kk.z;
    const d2=du*du*0.030+dz*dz*0.030;
    if(d2<8) s+=1.7*Math.exp(-d2);
  }
  return s;
}
function nearKicker(u,z){                      // 도약대 앞 8m ~ 뒤 26m, 좌우 5m
  const n=Math.floor(z/40);
  for(let k=n-1;k<=n;k++){ if(k<12) continue; const kk=kickerAt(k); if(z>kk.z-8&&z<kk.z+26&&Math.abs(u-kk.u)<5.2) return true; }
  return false;
}
function bank(u){                              // 도로 밖 노반: 올라가는 둔덕
  const a=Math.abs(u);
  return a>ROAD_HALF+1 ? Math.min(9,(a-ROAD_HALF-1)*(a-ROAD_HALF-1)*0.05) : 0;
}



function rawH(x,z){
  const u=x-cx(z), w=laneW(u);

  const laneDrop =
    (1-w)*cumDrop(z,0) +
    w*cumDrop(z,0.5);

  return -baseDrop(z)
       - laneDrop*laneDifficultyAt(z)
       + hills(x,z)
       + kicker(u,z)
       + bank(u);
}





// Facility pads are part of the terrain. Nothing is laid over a mismatched road surface.
const WORLD_PADS=[[-1,218,63,65,98],[1,296,78,79,123],[-1,406,80,82,110],
 [1,472,104,105,127],[-1,720,116,90,120],[1,1340,150,95,140]];
function scenicBand(z,a,b,fade){return smooth((z-(a-fade))/fade)*(1-smooth((z-b)/fade));}
function H(x,z){
const L=lz(z);

 const u=x-cx(z);let y=rawH(x,z);
 const interior=(1-smooth((z-155)/30))*smooth((38-Math.abs(u))/5);
 y=lerp(y,-baseDrop(z),interior);
 const campus=smooth((z-140)/30)*(1-smooth((z-465)/80))*smooth((Math.abs(u)-13.5)/5);
 y=lerp(y,rawH(cx(z),z)-.08,campus);
 // Only off-road building foundations are graded; the playable outdoor road is unchanged.
 if(Math.abs(u)>19)for(const[s,cz,off,w,l]of WORLD_PADS){
  const xx=cx(cz)+s*off,dx=Math.abs(x-xx)-w*.5,dz=Math.abs(z-cz)-l*.5;
  const k=(1-smooth((dx+1)/8))*(1-smooth((dz+1)/9));
  if(k>0)y=lerp(y,rawH(cx(cz),cz)-.95,k);
 }
 // Only the land outside the guardrails drops. The playable road and all obstacle coordinates stay identical.
 const roadBase=rawH(cx(z),z);
 const farmLake=scenicBand(L,1810,2320,95)*smooth((u-12.8)/7);
 y=lerp(y,roadBase-3.45-.22*Math.sin(z*.018),farmLake);
 const river=scenicBand(L,2580,2960,90)*smooth((Math.abs(u)-12.8)/10);
 y=lerp(y,roadBase-5.55-.28*Math.sin(x*.018),river);
 
 
// 검은 수면은 이 구간에서 끝나며, 뒤의 배와 연결되지 않는다.
 const nightLake=scenicBand(L,4920,5560,70)
   *smooth((-u-12.5)/3.2)*(1-smooth((-u-145)/28));
 y=lerp(y,roadBase-3.4,nightLake);



 // The abandoned cross street is a real cut through the embankment, not a folded terrain ribbon.
 const crossStreet=scenicBand(L,3482,3548,25)*smooth((Math.abs(u)-12.2)/8)*(1-smooth((Math.abs(u)-108)/18));
 y=lerp(y,rawH(cx(wz(3515)),wz(3515))-.04,crossStreet);
 // Only the route corridor falls into the sinkhole; the surface remains above on both sides.
const shipBasin=scenicBand(L,5780,6120,90)*smooth((u-14)/8)*(1-smooth((u-116)/18));

 y-=shipBasin*8.5;

 const cargoBay=smooth((z-(SF_A-10))/60)*(1-smooth((z-(SF_B-40))/60))*smooth((u-13)/7)*(1-smooth((u-150)/30));
 y=lerp(y,roadBase-10.5+.3*Math.sin(z*.05),cargoBay);


 const shipX=cx(wz(5960))+58,shipDx=Math.abs(x-shipX)-48,shipDz=Math.abs(z-wz(5960))-125,shipPad=(1-smooth((shipDx+1)/16))*(1-smooth((shipDz+1)/30))*smooth((Math.abs(u)-20)/12);
 y=lerp(y,rawH(cx(wz(5960)),wz(5960))-10.0,shipPad);
 const storyDepth=JW.storyDepthAt(z),corridor=1-smooth((Math.abs(u)-14)/30);
 y-=storyDepth*corridor;
 // At the broken cavern ledge the floor falls away while the rider glides toward the pipe mouth.
 y-=JW.glideAt(z)*18.0*(1-smooth((Math.abs(u)-18)/24));

  // 활공 직전 260m에서 추가로 72m 내려간다.
 // 추가 낙차는 파이프를 나온 뒤 긴 구간에 걸쳐 원래 지형으로 합류한다.
 const dive=smoother((z-(GLIDE_START-260))/260);
 const recover=1-smoother((z-(PIPE_END+40))/850);
 y-=72*dive*recover*(1-smooth((Math.abs(u)-14)/30));
 // The ending is a broad empty plain, not another mountain valley. Distant dunes remain at the edges.
 const endPlain=smooth((z-END_ROAD_FADE)/(END_FIELD-END_ROAD_FADE)),wide=1-smooth((Math.abs(u)-82)/68),plainY=rawH(cx(z),z);
 y=lerp(y,plainY,endPlain*wide*.94);
 // These are real low ridges in the terrain, not floating decorative slabs. They launch a chain of small hops.
y+=JW.wastelandBump(z)*(1-smooth((Math.abs(u)-11.4)/2.2));

return y;
}

function grad(x,z){
  const d=0.6, i=1/(2*d);
  return {x:(H(x+d,z)-H(x-d,z))*i, z:(H(x,z+d)-H(x,z-d))*i};
}

function mesh(geo,mat,sx,sy,sz,px,py,pz){
  const m=new THREE.Mesh(geo,mat); m.scale.set(sx,sy,sz); m.position.set(px,py,pz); return m;
}


function barXY(parent, mat, x1, y1, x2, y2, thick, z){
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy);

  const b = mesh(
    boxG,
    mat,
    thick,
    len,
    thick,
    (x1 + x2) / 2,
    (y1 + y2) / 2,
    z
  );

  // 로컬 Y축 막대를 두 점 사이에 정확히 맞춤
  b.rotation.z = Math.atan2(-dx, dy);

  parent.add(b);
  return b;
}



function triPrism(mat,w,h,d,px,py,pz){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, 0);
  shape.lineTo( w/2, 0);
  shape.lineTo(0, h);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d,
    bevelEnabled: false
  });
  geo.translate(0, 0, -d/2);
  geo.computeVertexNormals();

  const m = new THREE.Mesh(geo, mat);
  m.position.set(px,py,pz);
  return m;
}

const dotTex=(function(){

function burst(x,y,z,mats,n,spreadX,spreadZ,scale){
  const dirx=P.vx/Math.max(1,Math.hypot(P.vx,P.vz)), dirz=P.vz/Math.max(1,Math.hypot(P.vx,P.vz));

    pc.m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);

    pc.vx=dirx*6+(-dirz)*side*(3+Math.random()*7)+(Math.random()-0.5)*4;
    pc.vz=dirz*6+( dirx)*side*(3+Math.random()*7)+(Math.random()-0.5)*4;

function courseWindow(z,a,b,fade=70){
  return smooth((z-(a-fade))/fade)*(1-smooth((z-b)/fade));
}

// 0=완전한 해방, 1=장애물이 몰아치는 구간.
// 조작감 자체는 바꾸지 않고 장애물 밀도만 파도처럼 움직인다.
function coursePressureAt(z){
  if(z<1380)return 1;

  // 싱크홀 약 500m 전부터 일반 장애물을 완전히 비운다.
  if(z>=SINK_WARN-520)return 0;

  // 논밭·저수지: 길게 달리되 끝부분에만 짧은 파동.
  if(z<2500){
    return Math.min(1,
      .18+
      .34*courseWindow(z,1940,2110,70)+
      .26*courseWindow(z,2310,2460,60)
    );
  }

  // 강 다리와 철도 건널목: 두 번만 짧게 조인다.
  if(z<3220){
    return Math.max(
      .12,
      .78*courseWindow(z,2510,2740,80),
      .92*courseWindow(z,2980,3220,80)
    );
  }

  // 교차로·아파트·고가도로: 중간 강도의 두 파동.
  if(z<4320){
    return Math.max(
      .25,
      .68*courseWindow(z,3350,3650,90),
      .80*courseWindow(z,3870,4260,110)
    );
  }

  // 산악 터널은 짧고 밀도 있게.
  if(z<4680)return .88;

  // 검은 수면과 좌초선은 풍경을 보게 비운다.
  if(z<5630)return .08;
  if(z<6150)return .05;

  // 먼지 전선: 시야가 나쁜 만큼 장애물은 짧게만 몰린다.
  if(z<6860){
    return Math.max(.18,.55*courseWindow(z,6300,6540,80));
  }

  // 관람차 전후는 다시 해방.
  if(z<7350)return .08;

  // 스파이럴은 압박 → 해방 → 더 큰 압박 → 해방 → 최고조의 3파동.
  if(z<9200){
    return Math.max(
      .08,
      .76*courseWindow(z,7350,7780,100),
      .88*courseWindow(z,8150,8520,80),
      1.00*courseWindow(z,8780,9200,90)
    );
  }

  // 관측소와 깨진 달은 거의 방해 없이 본다.
  if(z<10450)return .10;
  return 0;
}

function courseBeatAt(z){
  if(z<188)return 'warehouse';
  if(z<245)return 'release';
  if(z<325)return 'choice';
  if(z<400)return 'breath';
  if(z<492)return 'smash';
  if(z<560)return 'tunnel-entry';
  if(z<630)return 'tunnel';
  if(z<725)return 'breath';
  if(z<815)return 'choice';
  if(z<920)return 'spiral-entry';
  if(z<1125)return 'spiral';
  if(z<1380)return 'release';

  if(z>SINK_WARN&&z<DAY_RETURN_FULL+120){
    return z<UNDER_START+160
      ? 'collapse'
      : z<GLIDE_START
        ? 'underground'
        : z<PIPE_END
          ? 'pipe'
          : 'return';
  }

  if(z>END_QUIET_START)return 'ending';

  const p=coursePressureAt(z);
  return p<.12
    ? 'release'
    : p<.38
      ? 'breath'
      : p<.68
        ? 'weave'
        : 'pressure';
}

  });

  });

  // 기본 모듈 위치는 유지한다.
  // 장면별 압력값에 따라 선택·파괴·회피 부분만 켜고 끈다.
  // 따라서 기존 오브젝트 풀 용량과 회피 동선은 그대로 보존된다.
  const k0=Math.max(

function fillDecal(c,z0){

      quad([u-0.07,y,z-0.07],[u-0.07,y+0.8,z-0.07],[u+0.07,y+0.8,z+0.07],[u+0.07,y,z+0.07],CLR.post);

function buildEndingJackField(){
  jack.updateMatrixWorld(true);
  const invJack=new THREE.Matrix4().copy(jack.matrixWorld).invert(),sources=[],bounds=new THREE.Box3();
  jack.traverse(o=>{if(!o.isMesh)return;o.updateMatrixWorld(true);if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();const rel=new THREE.Matrix4().multiplyMatrices(invJack,o.matrixWorld);bounds.union(o.geometry.boundingBox.clone().applyMatrix4(rel));sources.push({geo:o.geometry,mat:o.material,rel});});

  function addJack(z,u,fallen,sc,yaw,tip){
    const x=cx(z)+u;

      fallen?tip:0,

      'XYZ'

        v.fromBufferAttribute(pos,i).applyMatrix4(mx);

      }
    }

    // 누운 자키는 더 깊게, 서 있는 자키는 바퀴 쪽만 묻힌다.
    const y=support-(fallen?.42:.18);
    const index=Math.floor(rr()*paint.length);

    placements.push({
      matrix:new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),q,scale),
      paint:paint[index],
      dark:dark[index]

  }

  // Hand-placed exact-size jacks appear in the player's view before the wide field is revealed.
  const anchors=[
    [END_FIELD+55,-9,1,.96,.20,1.34],[END_FIELD+105,12,1,.93,2.40,-1.28],[END_FIELD+165,-17,0,.98,1.20,0],

    [END_FIELD+630,21,1,.96,5.70,1.40],[ENDING_AT-55,-12,1,.94,1.55,-1.34],[ENDING_AT+42,14,1,.97,4.30,1.32]
  ];
  for(const [z,u,f,sc,yaw,tip] of anchors)addJack(z,u,!!f,sc,yaw,tip);
  const total=innerWidth<680?70:104;
  for(let i=0;i<total;i++){
    let z=END_FIELD+35+Math.pow(rr(),.76)*(ENDING_AT-END_FIELD+650),side=rr()<.5?-1:1,u=side*(8.0+Math.pow(rr(),.72)*82);
    if(z>ENDING_AT-135&&z<ENDING_AT+120&&Math.abs(u)<8)u=side*(10+rr()*16);
    const fallen=rr()<.76,sc=.89+rr()*.10,tip=(1.10+rr()*.48)*(rr()<.5?-1:1);addJack(z,u,fallen,sc,rr()*Math.PI*2,tip);
  }
  const group=new THREE.Group();group.name='exact-player-jack-ending-field';scene.add(group);
  for(const src of sources){
    const recolor=src.mat===mJack||src.mat===mJackDark,mat=recolor?new THREE.MeshLambertMaterial({color:0xffffff}):src.mat.clone(),im=new THREE.InstancedMesh(src.geo,mat,placements.length),mx=new THREE.Matrix4();
    im.frustumCulled=false;im.name='abandoned-exact-jack-part';
    placements.forEach((pl,i)=>{mx.multiplyMatrices(pl.matrix,src.rel);im.setMatrixAt(i,mx);if(recolor)im.setColorAt(i,new THREE.Color(src.mat===mJack?pl.paint:pl.dark).convertSRGBToLinear());});
    im.instanceMatrix.needsUpdate=true;if(im.instanceColor)im.instanceColor.needsUpdate=true;group.add(im);
  }
  return group;
}

const rideF=new THREE.Vector3();
const rideU=new THREE.Vector3();
const rideR=new THREE.Vector3();
const rideM=new THREE.Matrix4();
const rideQ=new THREE.Quaternion();
const rideE=new THREE.Euler(0,0,0,'YXZ');
const rideLook=new THREE.Vector3();

function rideFrame(){
  const a=P.pipeMode?P.pipeAngle:0;

  rideF.set(P.vx,P.vy,P.vz).normalize();
  if(rideF.lengthSq()<.01)rideF.set(0,0,1);

  rideU.set(-Math.sin(a),Math.cos(a),0);
  rideR.crossVectors(rideU,rideF).normalize();
  rideU.crossVectors(rideF,rideR).normalize();
}

function specialTimers(dt,sp){
  // 특수 구간에서 누른 점프가 출구에서 뒤늦게 실행되지 않게 한다.
  P.jump=false;
  P.jumpImpulse=0;
  P.kickAnim=0;
  P.spin=0;

  P.top=Math.max(P.top,sp);
  P.dist=Math.max(P.dist,P.z);

  for(const key of ['inv','boost','scrape']){
    P[key]=Math.max(0,P[key]-dt);
  }

  P.shake=Math.max(0,P.shake-dt*2.2);
}

function scriptedMove(dt,x,y,z){
  P.vx=(x-P.x)/dt;
  P.vy=(y-P.y)/dt;
  P.vz=(z-P.z)/dt;

  P.x=x;P.y=y;P.z=z;
  P.jump=false;P.spin=0;P.kickAnim=0;
  P.tipMeter=0;P.onRail=false;

  specialTimers(dt,P.vz);
}

function downhillPhysics(dt){
  if(!P.diveMode)P.glideOffset=P.x-cx(P.z);

  P.diveMode=true;
  P.glideMode=false;P.pipeMode=false;
  P.ground=true;P.air=0;

  P.steer=lerp(P.steer,P.steerT,1-Math.exp(-7*dt));
  P.crouch=lerp(P.crouch,P.crouchT,1-Math.exp(-12*dt));

  // 조향·웅크리기로 감속하지 않는다.
  const t=smooth((P.z-(GLIDE_START-260))/260);
  const sp=Math.max(P.vz,34+30*t);
  const z=P.z+sp*dt;

  P.glideOffset=clamp(
    P.glideOffset-P.steer*7*dt,
    -11.65,11.65
  );

  // 도약 직전에는 자연스럽게 중앙으로 모인다.
  const x=cx(z)+P.glideOffset*
    (1-smooth((z-(GLIDE_START-80))/80));

  scriptedMove(dt,x,H(x,z),z);
}

function glidePhysics(dt){
  if(!P.glideMode){
    P.glideOffset=P.x-cx(P.z);
    P.glideLift=P.y-H(cx(P.z),P.z)-18*JW.glideAt(P.z);
  }

  P.diveMode=false;P.glideMode=true;P.pipeMode=false;
  P.ground=false;P.air+=dt;
  P.steer=lerp(P.steer,P.steerT,1-Math.exp(-5*dt));

  const z=P.z+Math.max(64,Math.min(74,P.vz+dt*2))*dt;
  const t=clamp(
    (z-GLIDE_START)/(PIPE_RIDE_START-GLIDE_START),
    0,1
  );

  // 파이프 입구 130m 전부터 내부 주행 높이로 합류.
  const enter=smooth((z-(PIPE_START-130))/130);

  P.glideOffset=lerp(
    P.glideOffset,-P.steer*1.15,
    1-Math.exp(-3*dt)
  );

  const x=cx(z)+P.glideOffset*(1-enter);
  const bottom=H(cx(z),z)+18*JW.glideAt(z);
  const flight=bottom
    +Math.sin(t*Math.PI)*3.5
    +(P.glideLift||0)*(1-t);

  scriptedMove(
    dt,x,
    lerp(flight,bottom+PIPE_RADIUS-PIPE_RIDE_RADIUS,enter),
    z
  );
}

function pipePhysics(dt){
  if(!P.pipeMode){
    P.pipeAngle=0;
    P.pipeExitFrom=null;
  }

  P.diveMode=false;P.pipeMode=true;P.glideMode=false;

let actx=null,muted=false,master=null,comp=null,noiseBuf=null;
let rumble=null,wind=null,scrape=null,creak=null,crackleT=0;
function mkNoise(){
  const len=actx.sampleRate*2, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function loop(type,freq,q){                       // 연속음 채널: 노이즈 → 필터 → 게인
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
  const g=actx.createGain(); g.gain.value=0;
  src.connect(f); f.connect(g); g.connect(master); src.start();
  return {f:f,g:g};
}
function audioStart(){
  if(actx){ if(actx.state==="suspended") actx.resume(); return; }
  if(muted) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=mkNoise();
    comp=actx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.16;
    master=actx.createGain(); master.gain.value=0.9;
    master.connect(comp); comp.connect(actx.destination);
    rumble=loop("lowpass",120);                    // 바퀴 구름
    wind=loop("bandpass",900,0.6);                 // 바람
    scrape=loop("bandpass",2600,7);                // 가드레일 긁힘
    // 긁힘 배음: 톱니파 + 비브라토
    const so=actx.createOscillator(); so.type="sawtooth"; so.frequency.value=1750;
    const lfo=actx.createOscillator(); lfo.frequency.value=6.5; const lg=actx.createGain(); lg.gain.value=40;
    lfo.connect(lg); lg.connect(so.frequency); lfo.start();
    const sf=actx.createBiquadFilter(); sf.type="bandpass"; sf.frequency.value=2200; sf.Q.value=3;
    scrape.tone=actx.createGain(); scrape.tone.gain.value=0;
    so.connect(sf); sf.connect(scrape.tone); scrape.tone.connect(master); so.start();
    // 전복 경고: 낮은 삐걱임
    const co=actx.createOscillator(); co.type="sawtooth"; co.frequency.value=52;
    const cl=actx.createOscillator(); cl.frequency.value=2.3; const clg=actx.createGain(); clg.gain.value=10;
    cl.connect(clg); clg.connect(co.frequency); cl.start();
    const cf=actx.createBiquadFilter(); cf.type="lowpass"; cf.frequency.value=380;
    creak={g:actx.createGain()}; creak.g.gain.value=0;
    co.connect(cf); cf.connect(creak.g); creak.g.connect(master); co.start();
  }catch(e){actx=null;}
}
/* ---- 원샷 부품 ---- */
function env(g,t,a,peak,d,curve){                 // 어택 → 피크 → 감쇠

  g.gain.linearRampToValueAtTime(peak,t+a);
  if(curve==="lin") g.gain.linearRampToValueAtTime(0.0001,t+a+d);
  else g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function tone(t,type,f0,f1,dur,peak,a,out){       // 오실레이터 한 방
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  env(g,t,a||0.003,peak,dur);
  o.connect(g); g.connect(out||master); o.start(t); o.stop(t+dur+0.05);
  return o;
}
function hiss(t,ftype,f0,f1,q,dur,peak,a,out){    // 노이즈 한 방
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  src.playbackRate.value=0.7+Math.random()*0.6;
  const f=actx.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(f0,t);
  if(f1!==f0) f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  f.Q.value=q||1;
  const g=actx.createGain(); env(g,t,a||0.003,peak,dur);
  src.connect(f); f.connect(g); g.connect(out||master); src.start(t); src.stop(t+dur+0.05);

function ring(t,freq,dur,peak,detune){            // 금속 울림: 배음 두 겹 + 미세 디튠

function marimba(t,freq,dur,peak){                // 나무/플라스틱 타악 음

function audioUpdate(sp,dt){
  if(!actx||muted)return;
  const n=clamp(sp/MAXV,0,1),wv=world3D.getState(),worldQuiet=1-wv.silence*.94;
  rumble.g.gain.value=(P.ground?1:0.12)*(0.02+n*0.10)*(running?1:0)*worldQuiet;
  rumble.f.frequency.value=90+n*280;
  wind.g.gain.value=(0.004+n*n*0.07)*(running?1:0)*worldQuiet;
  wind.f.frequency.value=500+n*1500;
  const sc=(P.scrape>0&&running&&!gamePaused)?clamp(sp/30,0.2,1):0;
  scrape.g.gain.value=lerp(scrape.g.gain.value,sc*0.22,0.4);
  scrape.tone.gain.value=lerp(scrape.tone.gain.value,sc*0.05,0.4);
  if(sc>0){ crackleT-=dt; if(crackleT<=0){ crackleT=0.02+Math.random()*0.06; const t=now(); hiss(t,"highpass",4000+Math.random()*4000,6000,2,0.02,0.18*sc,0.001); } }
  const cr=running&&!gamePaused&&P.ground?clamp((P.tipMeter-0.55)/0.45,0,1):0;
  creak.g.gain.value=lerp(creak.g.gain.value,cr*0.16,0.2);
}

  3.45,
  6.9,
  10.4
];

const MINI_MINE_BANDS=7;
const MINI_MINE_N=
  MINI_MINE_X.length*
  MINI_MINE_BANDS;

function miniMineLayout(i){
  const cols=MINI_MINE_X.length;
  const band=Math.floor(i/cols);
  const j=i%cols;

  // 현재 파렛트 밭 전체 길이를 7개의 느슨한 영역으로 나눈다.
  // 실제 화면에서는 같은 z에 정렬되지 않기 때문에 횡대로 보이지 않는다.
  const usable=
    CG_FIELD_B-
    CG_FIELD_A-
    14;

  const bandLen=
    usable/
    MINI_MINE_BANDS;

  // 매 영역마다 x 위치 순서를 뒤섞는다.
  const slot=
    (j*3+band*2)%
    cols;

  const hz=
    lmHash(
      8111+i*37
    );

  const hx=
    lmHash(
      9221+i*53
    );

  const hr=
    lmHash(
      10331+i*71
    );

  const hs=
    lmHash(
      12101+band*97
    );

  // 같은 영역 안에서도 앞뒤 위치를 크게 흩트린다.
  const z=
    CG_FIELD_A+
    7+
    band*bandLen+
    1.5+
    hz*(bandLen-3);

  // 도로 전체를 덮되, 반복되는 세로줄처럼 보이지 않도록
  // 영역 전체 이동과 개별 흔들림을 함께 적용한다.
  const u=Math.max(
    -10.7,
    Math.min(
      10.7,
      MINI_MINE_X[slot]+
      (hs-.5)*1.2+
      (hx-.5)*.9
    )
  );

  return{
    z,
    u,

    // 모든 파렛트가 진행 방향을 반듯하게 바라보지 않게 한다.
    yaw:hr*Math.PI*2
  };
}


// 화물선 뒤 대형 파렛트 지대.
// 12개의 느슨한 영역마다 네 방향에 파렛트를 흩뿌린다.
// 같은 z에 정렬되지 않으며, 초반에는 오른쪽 유실원에서 시작해
// 갈수록 도로 전폭으로 퍼진다.
const SHIP_MINE_X=[
  -9.6,
  -3.2,
  3.2,
  9.6
];

const SHIP_MINE_BANDS=12;

const SHIP_MINE_N=
  SHIP_MINE_X.length*
  SHIP_MINE_BANDS;

function shipMineLayout(i){
  const cols=SHIP_MINE_X.length;
  const band=Math.floor(i/cols);
  const j=i%cols;

  const usable=
    SF_FIELD_B-
    SF_FIELD_A-
    14;

  const bandLen=
    usable/
    SHIP_MINE_BANDS;

  // 각 영역마다 좌우 위치 순서를 섞는다.
  const slot=
    (j*3+band)%
    cols;

  const t=
    band/
    (SHIP_MINE_BANDS-1);

  const hz=
    lmHash(
      21001+i*41
    );

  const hx=
    lmHash(
      22103+i*59
    );

  const hy=
    lmHash(
      23311+i*73
    );

  const hr=
    lmHash(
      24709+i*83
    );

  const hp=
    lmHash(
      25913+i*97
    );

  // 동일 영역 안에서도 앞뒤 위치를 흩트려
  // 횡대나 아이템 줄처럼 보이지 않게 한다.
  const z=
    SF_FIELD_A+
    7+
    band*bandLen+
    1.4+
    hz*
    Math.max(
      2,
      bandLen-3.2
    );

  // 초반에는 오른쪽 컨테이너에서 흘러나오다가,
  // 뒤로 갈수록 편향이 줄어 도로 전체로 퍼진다.
  const sourceBias=
    3.2*
    Math.pow(
      1-t,
      2
    );

  const drift=
    1.15*
    Math.sin(
      band*.78+.35
    );

  const u=Math.max(
    -10.7,
    Math.min(
      10.7,
      SHIP_MINE_X[slot]+
      sourceBias+
      drift+
      (hx-.5)*1.15
    )
  );

  return{
    z,
    u,
    yaw:hr*Math.PI*2,
    pitch:(hy-.5)*.13,
    roll:(hp-.5)*.11
  };
}

function takePallet(kind){if(P.pallets>=LM_STACK_MAX)return false;stackKinds[P.pallets]=kind;P.pallets++;P.palMax=Math.max(P.palMax||0,P.pallets);setStack(P.pallets);sfx('pallet',P.pallets);return true;}
     
function poolPickup(){
  if(!activeField)return;

  const lift=
    P.y-
    H(P.x,P.z);

  if(lift>1.5)return;

 const mini=
  activeField.id===
  'container';

const ship=
  activeField.id===
  'ship';

  for(const g of specialPool){
    if(
      !g.visible||
      g.userData.taken
    ){
      continue;
    }

    const dz=
      g.position.z-
      P.z;

    const dx=
      Math.abs(
        g.position.x-
        P.x
      );

  const touched=
  mini
    ? (
        Math.abs(dz)<4.0&&
        dx<2.45
      )
    : ship
      ? (
          Math.abs(dz)<4.4&&
          dx<3.05
        )
      : (
          Math.hypot(dx,dz)<1.9
        );

    if(!touched)continue;

    if(
      P.pallets>=
      LM_STACK_MAX
    ){
      return;
    }

    g.userData.taken=true;
    g.visible=false;

    takePallet(
      g.userData.kind
    );
  }
}

function landmarkHitTest(){
 if(P.inv>0||!landmarkObstacles.length)return;
 const lift=P.y-H(P.x,P.z);

}

const SHARD_N=48,shards=[],shardGeo=new THREE.BoxGeometry(1,1,1);
const shardMats={cont:[lmMat(JWX.CONT.blue),lmMat(JWX.CONT.red),lmMat(JWX.CONT.grey),lmMat(JWX.CONT.ochre)],dark:lmMat(0x3a3e3c),card:lmMat(0x967750),spark:lmMat(0xffd070)};
for(let i=0;i<SHARD_N;i++){const m=new THREE.Mesh(shardGeo,shardMats.dark);m.visible=false;scene.add(m);shards.push({m,life:0,vx:0,vy:0,vz:0,ax:0,ay:0,az:0});}
let shardCursor=0;
function shardBurst(x,y,z,n,mats,spread,up,fwd,size){
 for(let i=0;i<n;i++){const s=shards[shardCursor++%SHARD_N],a=Math.random()*6.283,r=Math.random();
  s.m.material=mats[i%mats.length];s.m.visible=true;s.life=1.6+Math.random()*1.2;
  s.m.position.set(x+(Math.random()-.5)*2,y+(Math.random()-.5)*1.5,z+(Math.random()-.5)*2);
  s.m.scale.set(size*(.5+Math.random()),size*(.12+Math.random()*.4),size*(.5+Math.random()));
  s.vx=Math.cos(a)*spread*r+fwd[0];s.vz=Math.sin(a)*spread*r+fwd[2];s.vy=up*(.4+Math.random()*.9)+fwd[1];
  s.ax=(Math.random()-.5)*9;s.ay=(Math.random()-.5)*9;s.az=(Math.random()-.5)*9;}
}
function stepShards(dt){
 for(const s of shards){if(!s.m.visible)continue;s.life-=dt;if(s.life<=0){s.m.visible=false;continue;}
  s.vy-=22*dt;s.m.position.x+=s.vx*dt;s.m.position.y+=s.vy*dt;s.m.position.z+=s.vz*dt;
  const g=H(s.m.position.x,s.m.position.z)+s.m.scale.y*.5;if(s.m.position.y<g){s.m.position.y=g;s.vy=Math.abs(s.vy)*.28;s.vx*=.6;s.vz*=.6;s.ax*=.4;s.az*=.4;}
  s.m.rotation.x+=s.ax*dt;s.m.rotation.y+=s.ay*dt;s.m.rotation.z+=s.az*dt;
  if(s.life<.4)s.m.scale.multiplyScalar(Math.max(0,1-dt*3));}
}

function wallKeep(n){
  return n<=2
    ? n
    : n<=5
      ? 2
      : n<=9
        ? 3
        : 4;
}


function hitWall(){
  wall.broken=true;
  wall.t=0;
  wall.topBurst=false;

  const sp=Math.max(
    8,
    Math.hypot(
      P.vx,
      P.vz
    )
  );

  const fx=
    Math.abs(P.vx)+
    Math.abs(P.vz)>.5
      ? P.vx/sp
      : 0;

  const fz=
    Math.abs(P.vx)+
    Math.abs(P.vz)>.5
      ? P.vz/sp
      : 1;

  // 도로 진행방향의 오른쪽 벡터.
  const rx=fz;
  const rz=-fx;


  if(P.pallets>0){
    wall.drops=
      P.pallets-
      wallKeep(
        P.pallets
      );

    wall.dropT=.025;

    // 돌파 감각을 유지한다.
    P.vx*=.92;
    P.vz*=.92;

    // 실제 가속이 아니라 짧은 카메라 잔향.
    P.boost=Math.max(
      P.boost||0,
      .22
    );
  }else{
    wall.drops=0;
    crash(false);
  }


  P.inv=Math.max(
    P.inv||0,
    .95
  );

  P.shake=Math.max(
    P.shake||0,
    1.0
  );


  const plans={

function stepWall(dt){
  if(!wall.broken)return;

  wall.t+=dt;


  // 파렛트는 위에서부터 연속으로 날아간다.
  if(wall.drops>0){
    wall.dropT-=dt;

    if(wall.dropT<=0){
      const n=
        wall.drops>8
          ? 2
          : 1;

      dropPallets(n);

      wall.drops-=n;
      wall.dropT=.095;

// 높이가 점점 낮아지는 세 구조물을 실제 z 위치에서 순서대로 맞는다.
const gate={
  z:SF_STRUCT,
  done:false,
  active:false,
  stage:0,
  plan:[0,0,0],

  marks:[
    SF_STRUCT-6,
    SF_STRUCT+10,
    SF_STRUCT+26
  ]
};

function gateKeep(n){
  return n<=8
    ? n
    : n<=15
      ? 8
      : 10;
}

function makeGatePlan(total){
  if(total<=0){
    return[0,0,0];
  }

  let a=
    Math.round(
      total*.28
    );

  let b=
    Math.round(
      total*.34
    );

  if(total>=3){
    a=Math.max(
      1,
      a
    );

    b=Math.max(
      1,
      b
    );
  }

  if(a+b>total){
    b=Math.max(
      0,
      total-a
    );
  }

  return[
    a,
    b,
    Math.max(
      0,
      total-a-b
    )
  ];
}

function triggerGate(){
  gate.done=true;
  gate.active=true;
  gate.stage=0;

  const keep=
    gateKeep(
      P.pallets
    );

  const total=
    Math.max(
      0,
      P.pallets-keep
    );

  gate.plan=
    makeGatePlan(
      total
    );

  if(total<=0){
    gate.active=false;
    return;
  }

  P.inv=Math.max(
    P.inv||0,
    .55
  );
}

function strikeGateStage(
  n,
  index
){
  if(n<=0)return;

  const topBefore=
    P.y+
    (
      typeof stackH===
      'number'
        ? stackH
        : P.pallets*.15
    )+
    .32;

  dropPallets(n);

  // 뒤쪽 낮은 구조물일수록 몸도 더 낮춘다.
  P.crouch=Math.max(
    P.crouch||0,
    index===2
      ? 1
      : .72
  );

  P.crouchT=Math.max(
    P.crouchT||0,
    index===2
      ? .82
      : .58
  );

  // 거의 감속하지 않고 위쪽 적재물만 벗겨낸다.
  P.vx*=.992;
  P.vz*=.992;

  P.inv=Math.max(
    P.inv||0,
    .38
  );

  P.shake=Math.max(
    P.shake||0,
    .34+
    index*.16
  );

  shardBurst(
    P.x,
    topBefore,
    P.z,

    Math.min(
      20,
      8+n*2
    ),

    [
      shardMats.spark,
      shardMats.dark
    ],

    5.0+
    index*1.1,

    4.8+
    index*.8,

    [
      -P.vx*.12,
      1.5,
      -P.vz*.18
    ],

    .28+
    index*.05
  );

  sfx(
    'shield',
    false
  );

  sfx(
    'smash',
    index===1
  );
}

function stepGate(dt){
  if(!gate.active)return;

  // 속도가 높아 한 프레임에 구조물을 둘 이상 지나도
  // 빠진 단계 없이 모두 순서대로 처리한다.
  while(
    gate.stage<
    gate.marks.length&&
    P.z>=
    gate.marks[
      gate.stage
    ]-.8
  ){
    const index=
      gate.stage++;

    strikeGateStage(
      gate.plan[index]||0,
      index
    );
  }

  if(
    gate.stage>=
    gate.marks.length
  ){
    gate.active=false;
  }
}

function captureRevealFrame(){
  const z=P.z;

    cx(z+8)-

  const len=
    Math.hypot(
      dx,
      dz

  return{
    fx,
    fz,

    // 도로 진행 방향의 오른쪽 벡터.
    rx:fz,
    rz:-fx
  };
}


function revealK(){
  if(reveal.t<0){
    return 0;
  }

  const fadeIn=.32;
  const fadeOut=.40;

  const inK=
    sm01(
      Math.min(
        reveal.t/fadeIn,
        1
      )

  const outStart=
    Math.max(
      fadeIn,
      reveal.dur-fadeOut

  const outK=
    1-
    sm01(
      Math.max(
        0,
        (
          reveal.t-
          outStart
        )/
        fadeOut
      )
    );

  return inK*outK;
}

if(/[?&]tour=1/.test(location.search)){
  const panel=
    document.createElement(
      'div'
    );

  panel.style.cssText=[
    'position:fixed',
    'right:8px',
    'top:8px',
    'z-index:9999',
    'width:220px',
    'max-width:calc(100vw - 16px)',
    'max-height:calc(100vh - 16px)',
    'display:flex',
    'flex-direction:column',
    'overflow:hidden',
    'background:rgba(25,29,27,.94)',
    'border:1px solid rgba(255,255,255,.18)',
    'border-radius:9px',
    'box-shadow:0 10px 34px rgba(0,0,0,.35)',
    'font:12px/1.3 system-ui,sans-serif',
    'pointer-events:auto',
    'touch-action:auto'
  ].join(';');


  // 게임 조작으로 입력이 새지 않게 한다.
  panel.addEventListener(
    'pointerdown',
    e=>e.stopPropagation()
  );

  panel.addEventListener(
    'pointerup',
    e=>e.stopPropagation()
  );


  const head=
    document.createElement(
      'button'
    );

  head.textContent=
    'TOUR  ▾';

  head.style.cssText=[
    'margin:0',
    'width:100%',
    'padding:9px 10px',
    'border:0',
    'border-radius:0',
    'background:#f5c400',
    'color:#2a2118',
    'box-shadow:none',
    'font:900 12px/1 system-ui,sans-serif',
    'text-align:left',
    'cursor:pointer'
  ].join(';');

  panel.appendChild(
    head
  );


  const status=
    document.createElement(
      'div'
    );

  status.style.cssText=[
    'padding:8px 10px',
    'color:#dce6df',
    'background:rgba(0,0,0,.18)',
    'white-space:pre-line',
    'font-variant-numeric:tabular-nums'
  ].join(';');

  panel.appendChild(
    status
  );


  const list=
    document.createElement(
      'div'
    );

  list.style.cssText=[
    'display:grid',
    'gap:4px',
    'padding:6px',
    'overflow-y:auto',
    'touch-action:pan-y',
    'overscroll-behavior:contain'
  ].join(';');

  panel.appendChild(
    list
  );


  const points=[
    [
      '00  출발 · 창고 내부',
      20
    ],
    [
      '01  도크문 직전',
      138
    ],
    [
      '02  반실내 접안구역',
      190
    ],
    [
      '03  진짜 외부 개방',
      252
    ],
    [
      '04  컨테이너 이상징후',
      CG_A+48
    ],
    [
      '05  미니 파렛트 밭',
      CG_FIELD_A-30
    ],
    [
      '06  9단 공개 진입',
      CG_FIELD_B-14
    ],
    [
      '07  컨테이너 벽',
      CG_WALL-58
    ],
    [
      '08  컨테이너 공동묘지',
      CG_GRAVE_A+34
    ],
    [
      '09  좌초 컨테이너선',
      wz(5845)
    ],
    [
      '10  유실 화물지대',
      SF_FIELD_A-42
    ],
    [
      '11  24단 공개 진입',
      SF_REVEAL-28
    ],
    [
      '12  화물 게이트',
      SF_STRUCT-72
    ],
    [
      '13  스파이럴 3파동',
      wz(8360)
    ],
    [
      '14  싱크홀 전 고요',
      SINK_WARN-430
    ]
  ];


  let activeButton=null;


  function paintTourButton(
    button,
    active
  ){
    button.style.background=
      active
        ? '#f5c400'
        : '#fff7e6';

    button.style.color=
      '#3a2a10';
  }


  for(const[
    label,
    z
  ]of points){
    const button=
      document.createElement(
        'button'
      );

    button.textContent=
      label;

    button.style.cssText=[
      'margin:0',
      'width:100%',
      'padding:7px 9px',
      'border:0',
      'border-radius:6px',
      'background:#fff7e6',
      'color:#3a2a10',
      'box-shadow:none',
      'font:700 12px/1.2 system-ui,sans-serif',
      'text-align:left',
      'cursor:pointer'
    ].join(';');


    button.addEventListener(
      'click',
      e=>{
        e.stopPropagation();

        if(activeButton){
          paintTourButton(
            activeButton,
            false
          );
        }

        activeButton=
          button;

        paintTourButton(
          activeButton,
          true
        );

        inspectWorldAt(
          z,
          true
        );
      }
    );

    list.appendChild(
      button
    );
  }


  let opened=true;

  head.addEventListener(
    'click',
    e=>{
      e.stopPropagation();

      opened=
        !opened;

      list.style.display=
        opened
          ? 'grid'
          : 'none';

      status.style.display=
        opened
          ? 'block'
          : 'none';

      head.textContent=
        opened
          ? 'TOUR  ▾'
          : 'TOUR  ▸';
    }
  );


  document.body.appendChild(
    panel
  );


  // 투어 모드에서만 실행되는
  // 경량 성능 모니터.
  let last=
    performance.now();

  let fps=60;


  function monitorTour(now){
    const dt=
      Math.max(
        1,
        now-last
      );

    last=now;

    fps=
      fps*.90+
      Math.min(
        120,
        1000/dt
      )*.10;


    const info=
      renderer.info.render||{};

    let beat='—';

    try{
      const inserted=
        insertAt(
          P.z
        );

      beat=
        inserted
          ? inserted.ins.name
          : courseBeatAt(
              P.z
            );

    }catch(e){}


    status.textContent=
      (
        P.z/1000
      ).toFixed(2)+
      ' km · PAL '+
      (
        P.pallets||0
      )+
      '\n'+

      beat+
      '\n'+

      Math.round(
        fps
      )+
      ' fps · '+

      (
        info.calls||0
      )+
      ' calls · '+

      Math.round(
        info.triangles||0
      ).toLocaleString()+
      ' tri';


    requestAnimationFrame(
      monitorTour
    );
  }


  requestAnimationFrame(
    monitorTour
  );
}



// 디버깅용 노출 (콘솔에서 __landmarks.wall 등으로 상태 확인)
window.__landmarks={wall,gate,reveal,REVEALS,FIELDS,specialPool,activateField,resetLandmarks,landmarkStep,inspectLandmarks,revealK};
}




reset(); P.alive=false;poseT=1;
animateRider(1,0);introCamera(1);
requestAnimationFrame(frame);

window.__game={world:world3D,inspectWorldAt:inspectWorldAt,showWorldIntro:showWorldIntro,story:story,pauseTour:function(v){if(WORLD_TOUR)worldInspectPaused=!!v;},setPaused:setPaused,togglePause:togglePause,paused:()=>gamePaused,renderStats:function(){return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,programs:renderer.info.programs.length};},P:P,start:start,H:H,cx:cx,cam:camera,rider:rider,SFX:SFX,actxState:function(){return actx?actx.state:'none';},master:function(){return master;},ctx:function(){return actx;},snapCam:function(){camInit=false;},setStack:function(n){for(let i=0;i<n;i++) if(!stackKinds[i]) stackKinds[i]=hash1(i*5.3)<0.5?"aj":"kpp"; setStack(n);},finish:finish,
  course:{beatAt:courseBeatAt,events:courseEvents,state:()=>({...courseRun}),
    visible:()=>chunks.flatMap(c=>c.obs.filter(o=>o.visible).map(o=>({z:o.position.z,x:o.position.x,u:o.position.x-cx(o.position.z),role:o.userData.role,soft:!!o.userData.soft,hits:o.userData.hits,yaw:o.rotation.y})))},
  sim:function(dt,n){const out=[];for(let i=0;i<n;i++){if(!P.alive)break;runStep(dt);stepPieces(dt);world3D.update(dt,Math.hypot(P.vx,P.vz));
    if(i%Math.floor(n/12||1)===0)out.push({t:+(i*dt).toFixed(1),v:+(Math.hypot(P.vx,P.vz)*3.6).toFixed(0),
      u:+(P.x-cx(P.z)).toFixed(0),z:+P.z.toFixed(0),air:P.ground?0:1,hit:P.hits});}return out;}};
})();

</script>
