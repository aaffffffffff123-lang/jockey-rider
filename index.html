<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>자키 라이더</title>
<style>
  :root{
    --ink:#3B2A1C;
    --ink-soft:#8A6E56;
    --paper:rgba(255,250,242,.88);
    --line:rgba(59,42,28,.18);
    --haz:#F5C400;
    --hot:#D9472B;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#F3DDC0;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);touch-action:none;overscroll-behavior:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  #hud.on{opacity:1}
  .haz{background:repeating-linear-gradient(135deg,var(--haz) 0 10px,#2A2118 10px 20px)}

  .speedbox{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));
    background:var(--paper);padding:8px 14px 10px;border-top:6px solid transparent;
    box-shadow:0 8px 24px rgba(59,42,28,.18)}
  .speedbox::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 9px,#2A2118 9px 18px)}
  .spd{font-size:58px;line-height:.9;font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
  .spd small{font-size:14px;font-weight:800;letter-spacing:0;color:var(--ink-soft);margin-left:4px}
  .tip{margin-top:9px;height:10px;width:160px;background:rgba(59,42,28,.12);position:relative;overflow:hidden}
  .tip i{position:absolute;left:0;top:0;bottom:0;width:0%;
    background:repeating-linear-gradient(135deg,var(--haz) 0 8px,#2A2118 8px 16px);transition:width .06s linear}
  .tip.danger i{background:repeating-linear-gradient(135deg,var(--hot) 0 8px,#2A2118 8px 16px)}
  .pow{margin-top:6px;height:10px;width:160px;background:rgba(59,42,28,.12);position:relative;overflow:hidden;display:none}
  .pow.on{display:block}
  .pow i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#FF3B2F;box-shadow:0 0 10px #FF3B2F;transition:width .06s linear}

  .distbox{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
    text-align:right;background:var(--paper);padding:8px 14px 10px;box-shadow:0 8px 24px rgba(59,42,28,.18)}
  .distbox::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 9px,#2A2118 9px 18px)}
  .dist{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
  .dist small{font-size:12px;font-weight:800;color:var(--ink-soft);margin-left:2px}
  .lives{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
  .lives b{width:16px;height:12px;border-radius:8px 8px 2px 2px;background:var(--haz);
    box-shadow:inset 0 -3px 0 rgba(59,42,28,.35);transition:all .25s}
  .lives b.off{background:rgba(59,42,28,.15);box-shadow:none}
  .pal{margin-top:7px;font-size:13px;font-weight:800;color:var(--ink-soft)}
  .pal b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}

  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 55%,rgba(217,71,43,0) 35%,rgba(217,71,43,.55) 100%)}
  #flash.shield{background:radial-gradient(circle at 50% 55%,rgba(159,190,56,0) 40%,rgba(159,190,56,.5) 100%)}
  #boostfx{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 60%,rgba(255,255,255,0) 40%,rgba(245,196,0,.45) 100%)}

  /* ---------- 스틱 ---------- */
  #stick{position:fixed;width:118px;height:118px;margin:-59px 0 0 -59px;pointer-events:none;
    opacity:0;transition:opacity .12s}
  #stick.on{opacity:1}
  #stick .ring{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,250,242,.95);
    background:rgba(59,42,28,.12);box-shadow:0 6px 22px rgba(59,42,28,.22)}
  #stick .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
    border-radius:50%;background:var(--haz);box-shadow:0 4px 12px rgba(59,42,28,.35),inset 0 -4px 0 rgba(59,42,28,.25)}

  /* ---------- 오버레이 ---------- */
  .sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(243,221,192,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
  .sheet.hide{display:none}
  .card{width:min(430px,100%);background:var(--paper);padding:28px 28px 26px;position:relative;
    box-shadow:0 26px 60px rgba(59,42,28,.25)}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;
    background:repeating-linear-gradient(135deg,var(--haz) 0 12px,#2A2118 12px 24px)}
  .title{font-size:54px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:8px}
  .sub{margin-top:10px;color:var(--ink-soft);font-size:15px;line-height:1.65}
  .keys{margin-top:20px;display:flex;flex-direction:column;gap:9px}
  .keys div{display:flex;gap:12px;align-items:baseline;font-size:14.5px}
  .keys span{flex:0 0 92px;font-weight:800;color:var(--ink)}
  .keys em{font-style:normal;color:var(--ink-soft)}
  button{pointer-events:auto;margin-top:24px;width:100%;border:0;padding:17px;
    font-size:18px;font-weight:900;letter-spacing:-.02em;color:#2A2118;background:var(--haz);
    box-shadow:inset 0 -5px 0 rgba(59,42,28,.3);font-family:inherit;cursor:pointer;transition:transform .08s}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .stats{margin-top:22px;display:flex;gap:10px}
  .stats div{flex:1;background:rgba(255,255,255,.7);padding:14px 12px 12px;box-shadow:inset 0 0 0 1px var(--line)}
  .stats b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .stats i{font-style:normal;font-size:11.5px;color:var(--ink-soft);font-weight:800;white-space:nowrap}

  .rank{display:none;margin-top:16px;gap:8px}
  .rank.on{display:flex}
  .rank input{flex:1;min-width:0;border:0;padding:14px;font-size:16px;font-family:inherit;color:var(--ink);
    background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line)}
  .rank input:focus{outline:2px solid var(--haz)}
  .rank button{margin-top:0;width:auto;padding:14px 20px}
  .rank button[disabled]{opacity:.5}
  .rankmsg{margin-top:8px;font-size:13px;font-weight:700;color:var(--ink-soft);min-height:1em}
  .board{margin-top:6px;max-height:190px;overflow:auto}
  .board table{width:100%;border-collapse:collapse;font-size:13.5px}
  .board td{padding:6px 6px;border-bottom:1px solid var(--line)}
  .board td:first-child{width:26px;color:var(--ink-soft);font-weight:800}
  .board td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  
  
  
/* ---------- 인트로 포스터 ---------- */
.poster{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,214,120,.22), rgba(255,214,120,0) 34%),
    linear-gradient(180deg, rgba(85,43,99,.18), rgba(243,221,192,0) 45%);
}
.poster.hide{display:none}

.poster .frame{
  position:absolute;
  inset:10px;
  border:3px solid rgba(58,15,15,.55);
  outline:2px solid rgba(255,214,77,.55);
  outline-offset:-9px;
  pointer-events:none;
}

.heroHead{
  position:absolute;
  left:0; right:0;
  top:calc(24px + env(safe-area-inset-top));
  text-align:center;
  padding:0 18px;
}

.heroHead .ko{
  font-size:min(15vw,108px);
  font-weight:900;
  letter-spacing:-.05em;
  line-height:1;
  background:linear-gradient(180deg,#FFF7D7 0%,#FFD75B 28%,#FF8748 54%,#FFE3A6 78%,#FFF7D7 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:
    drop-shadow(3px 0 0 #351116)
    drop-shadow(-3px 0 0 #351116)
    drop-shadow(0 3px 0 #351116)
    drop-shadow(0 -3px 0 #351116)
    drop-shadow(0 8px 14px rgba(53,17,22,.30));
}



.heroBottom{
  position:absolute;
  left:0; right:0;
  bottom:calc(34px + env(safe-area-inset-bottom));
  text-align:center;
}

.startBtn{
  pointer-events:auto;
  display:inline-block;
  width:auto;
  margin:0;
  padding:16px 34px;
  border:0;
  border-radius:999px;
  font-size:22px;
  font-weight:900;
  letter-spacing:-.03em;
  color:#2A2118;
  background:linear-gradient(180deg,#FFE37A 0%, #F5C400 100%);
  box-shadow:
    0 10px 24px rgba(59,42,28,.24),
    inset 0 -5px 0 rgba(59,42,28,.22);
  font-family:inherit;
  cursor:pointer;
}

.startBtn:active{transform:translateY(2px)}

.startHint{
  margin-top:12px;
  font-size:13px;
  font-weight:800;
  color:rgba(59,42,28,.78);
  letter-spacing:.02em;
}

.pkeys{
  position:absolute;
  left:calc(18px + env(safe-area-inset-left));
  bottom:calc(30px + env(safe-area-inset-bottom));
  background:rgba(255,250,242,.82);
  padding:10px 12px;
  font-size:12.5px;
  line-height:1.55;
  color:var(--ink);
  box-shadow:0 8px 24px rgba(59,42,28,.18);
}

.pkeys div{display:flex;gap:10px}
.pkeys span{flex:0 0 58px;font-weight:800}
.pkeys em{font-style:normal;color:var(--ink-soft)}

@media (max-width:640px){
  .pkeys{
    left:50%;
    transform:translateX(-50%);
    bottom:calc(120px + env(safe-area-inset-bottom));
    width:min(92vw,360px);
    font-size:12px;
  }
  .pkeys div{gap:8px}
}


  @media (prefers-reduced-motion:reduce){ .press{animation:none} }
  #sound{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
    width:44px;height:44px;background:var(--paper);color:var(--ink);
    box-shadow:0 6px 18px rgba(59,42,28,.2);display:flex;align-items:center;justify-content:center;
    font-size:19px;pointer-events:auto;cursor:pointer;z-index:5}

  @media (max-width:420px){ .spd{font-size:46px} .title{font-size:44px} .tip,.pow{width:130px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }




</style>
</head>
<body>
<!-- 화면 문구는 아래 hud / intro / over 세 블록 안에만 있습니다 -->
<div id="app"></div>

<div id="hud">
  <div class="speedbox">
    <div class="spd"><span id="spd">0</span><small>km/h</small></div>
    <div class="tip" id="tip"><i></i></div>
    <div class="pow" id="pow"><i></i></div>
  </div>
  <div class="distbox">
    <div class="dist"><span id="dist">0</span><small>m</small></div>
    <div class="lives" id="lives"></div>
    <div class="pal"><b id="pal">0</b>단</div>
  </div>
</div>

<div id="stick"><div class="ring"></div><div class="nub" id="nub"></div></div>
<div id="flash"></div>
<div id="boostfx"></div>
<div id="sound">♪</div>



<div class="poster" id="intro">
  <div class="frame"></div>

<div class="heroHead">
  <div class="ko" data-t="자키 라이더">자키 라이더</div>
</div>

  <div class="heroBottom">
    <button id="go" class="startBtn">게임 시작</button>
    <div class="startHint">터치 · 클릭 · Enter · Space</div>
  </div>

  <div class="pkeys">
    <div><span>조향</span><em>드래그 좌우 · ← →</em></div>
    <div><span>웅크리기</span><em>스틱 아래로 · ↓ Space</em></div>
    <div><span>점프</span><em>웅크렸다가 손 떼기</em></div>
    <div><span>발 구르기</span><em>짧게 탭 · Space 짧게</em></div>
    <div><span>경광봉</span><em>잠깐 무적 · 장애물 박살</em></div>
    <div><span>파렛트</span><em>충돌 시 범퍼 역할</em></div>
  </div>
</div>


<div class="sheet hide" id="over">
  <div class="card">
    <div class="title" id="overTitle">기록</div>
    <div class="stats">
      <div><b id="rDist">0</b><i>거리 m</i></div>
      <div><b id="rPal">0</b><i>최고 적재 단</i></div>
      <div><b id="rBest">0</b><i>최고기록 m</i></div>
    </div>
    <div class="rank" id="rank">
      <input id="nick" maxlength="12" placeholder="닉네임" autocomplete="off">
      <button id="submit" type="button">등록</button>
    </div>
    <div class="rankmsg" id="rankmsg"></div>
    <div class="board" id="board"></div>
    <button id="again">다시</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ==================================================================
   1. 상수 / 유틸
   ================================================================== */
const SEG       = 70;     // 한 구간 길이(z): 절반씩 좌/우 차로가 번갈아 가파르다


const D0=0.8, D1=2.0;

// 초반은 완만한 내리막 → 후반으로 갈수록 빨라짐
const B0=0.075, B1=0.17;
const RAMP_Z=1400;

// 도로 굽이도 천천히 본격화
const CURVE_Z=1200;


const CH_LEN    = 60;     // 청크 z 길이
const CH_HALF_W = 80;     // 청크 x 반폭
const GX = 64, GZ = 48;   // 청크 격자 분할
const CHUNKS    = 9;
const ROAD_HALF = 12.5;   // 아스팔트 반폭
const RAIL      = 12.0;   // 가드레일(단단한 벽) 위치
const MED       = 1.3;    // 중앙분리대 반폭
const G         = 36;     // 중력 가속 계수
/* 랭킹: 「지게차 연수원」과 같은 앱스스크립트 웹앱.
   등록 POST(text/plain JSON) = {game:'jockey', kind:'run', name, score, dist, top, pallets, elapsed, seed, date}
   조회 JSONP = ?game=jockey&callback=fn  (응답에서 배열을 찾아 상위 10명을 보여준다) */
const RANK_URL  = "https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec";
const GAME_ID   = "jockey";
const VERSION   = 1;
/* 난이도 손잡이 */



// 여기까지는 사실상 튜토리얼 겸 관광 구간
const EASY_END = 260;

// 여기쯤부터 현재 게임의 풀 난이도
const HARD_AT = 1250;

// 장애물 간격도 초반 널널 → 후반 촘촘
const OBS_GAP_EASY = 28;
const OBS_GAP_HARD = 11;

const TIP_RATE = 0.8;
const LIVES    = 5;
const MAXV     = 52;




/* 시드: ?seed=숫자 로 코스를 바꾼다. ?daily=1 이면 날짜(KST) 기준으로 전원 같은 판 */
const SEED=(function(){ try{ const q=new URLSearchParams(location.search);
  if(q.get("daily")) return Math.floor((Date.now()+9*3600e3)/86400e3)%100000;
  return parseInt(q.get("seed")||"0",10)||0; }catch(e){ return 0; } })();
const SP=SEED*1.37;                              // 지형 위상 오프셋

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}

function difficultyAt(z){
  return smooth((z-EASY_END)/(HARD_AT-EASY_END));
}

// 자연지형 울퉁불퉁함
function roughnessAt(z){
  return smooth((z-260)/850);
}

// 좌우 차로별 낙차
function laneDifficultyAt(z){
  return smooth((z-340)/850);
}

// 인공 도약대
function kickerStrengthAt(z){
  return smooth((z-500)/650);
}



function smoother(t){t=clamp(t,0,1);return t*t*t*(t*(t*6-15)+10);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash1(n){const v=Math.sin(n*127.1+311.7+SEED*0.731)*43758.5453;return v-Math.floor(v);}
function ihash(n){ n=(n^61)^(n>>>16); n=Math.imul(n,9)>>>0; n=(n^(n>>>4))>>>0; n=Math.imul(n,0x27d4eb2d)>>>0; n=(n^(n>>>15))>>>0; return n/4294967296; }

function curveAmp(z){
  // 초반은 거의 직선.
  // 180m 이후부터 서서히 현재 수준까지 굽어진다.
  return 0.04 + 0.96*smooth((z-180)/(CURVE_Z-180));
}




function cx(z){ return curveAmp(z)*(18*Math.sin(z*0.0060+SP) + 7*Math.sin(z*0.0140+1.7+SP)); }
function cxSlope(z){ return cx(z+0.5)-cx(z-0.5); }
/* ---- 기본 경사의 누적 낙차: 경사가 B0→B1 로 서서히 오른다 ---- */
function baseDrop(z){
  if(z<=0) return z*B0;
  if(z>=RAMP_Z) return B0*RAMP_Z+(B1-B0)*RAMP_Z*0.5+B1*(z-RAMP_Z);
  const t=z/RAMP_Z;
  return B0*z+(B1-B0)*RAMP_Z*(t*t*t-t*t*t*t*0.5);
}
function segDrop(n){ return D0+(D1-D0)*smooth((n*SEG)/RAMP_Z); }
const dropPrefix=[0];
function dropBefore(n){
  if(n<=0) return n*D0;
  while(dropPrefix.length<=n) dropPrefix.push(dropPrefix[dropPrefix.length-1]+segDrop(dropPrefix.length-1));
  return dropPrefix[n];
}

/* ---- 지형 높이 ---- */
function steepLane(z){ return ((z%SEG)+SEG)%SEG < SEG*0.5 ? 0 : 1; }   // 0=왼쪽 차로, 1=오른쪽 차로
function laneW(u){ return smooth((u+MED+4.7)/((MED+4.7)*2)); }        // 중앙 ±6m 안에서 완만히 전환
function cumDrop(z,phase){
  const n=Math.floor(z/SEG), p=(z-n*SEG)/SEG;
  return dropBefore(n) + segDrop(n)*smoother((p-phase)/0.5);
}




function hills(x,z){
  const a=roughnessAt(z);

  return a*(
      2.20*Math.sin(z*0.0210+x*0.0060+SP)
    + 1.40*Math.sin(x*0.0220-z*0.0170+1.3+SP)
    + 0.75*Math.sin(z*0.0700+x*0.0140+SP*0.5)
    + 0.40*Math.sin(x*0.0500+z*0.0450+2.1)
  );
}




/* 융기: 40m마다 하나, 그때 가파른 차로에 솟은 아스팔트 (도약대) */
function kickerAt(k){
  const kz=k*40+9+hash1(k)*22;
  const ku=(steepLane(kz)?1:-1)*(3.2+hash1(k+91.3)*5.5);
  return {u:ku,z:kz};
}
function kicker(u,z){
  const n=Math.floor(z/40); let s=0;
  for(let k=n-1;k<=n+1;k++){
    if(k<12) continue;
    const kk=kickerAt(k);
    const du=u-kk.u, dz=z-kk.z;
    const d2=du*du*0.030+dz*dz*0.030;
    if(d2<8) s+=1.7*Math.exp(-d2);
  }
  return s;
}
function nearKicker(u,z){                      // 도약대 앞 8m ~ 뒤 26m, 좌우 5m
  const n=Math.floor(z/40);
  for(let k=n-1;k<=n;k++){ if(k<12) continue; const kk=kickerAt(k); if(z>kk.z-8&&z<kk.z+26&&Math.abs(u-kk.u)<5.2) return true; }
  return false;
}
function bank(u){                              // 도로 밖 노반: 올라가는 둔덕
  const a=Math.abs(u);
  return a>ROAD_HALF+1 ? Math.min(9,(a-ROAD_HALF-1)*(a-ROAD_HALF-1)*0.05) : 0;
}



function H(x,z){
  const u=x-cx(z), w=laneW(u);

  const laneDrop =
    (1-w)*cumDrop(z,0) +
    w*cumDrop(z,0.5);

  return -baseDrop(z)
       - laneDrop*laneDifficultyAt(z)
       + hills(x,z)
       + kicker(u,z)
       + bank(u);
}




function grad(x,z){
  const d=0.6, i=1/(2*d);
  return {x:(H(x+d,z)-H(x-d,z))*i, z:(H(x,z+d)-H(x,z-d))*i};
}

function mesh(geo,mat,sx,sy,sz,px,py,pz){
  const m=new THREE.Mesh(geo,mat); m.scale.set(sx,sy,sz); m.position.set(px,py,pz); return m;
}


function barXY(parent, mat, x1, y1, x2, y2, thick, z){
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy);

  const b = mesh(
    boxG,
    mat,
    thick,
    len,
    thick,
    (x1 + x2) / 2,
    (y1 + y2) / 2,
    z
  );

  // 로컬 Y축 막대를 두 점 사이에 정확히 맞춤
  b.rotation.z = Math.atan2(-dx, dy);

  parent.add(b);
  return b;
}



function triPrism(mat,w,h,d,px,py,pz){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, 0);
  shape.lineTo( w/2, 0);
  shape.lineTo(0, h);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d,
    bevelEnabled: false
  });
  geo.translate(0, 0, -d/2);
  geo.computeVertexNormals();

  const m = new THREE.Mesh(geo, mat);
  m.position.set(px,py,pz);
  return m;
}

let pieceHead=0;
function burst(x,y,z,mats,n,spreadX,spreadZ,scale){
  const dirx=P.vx/Math.max(1,Math.hypot(P.vx,P.vz)), dirz=P.vz/Math.max(1,Math.hypot(P.vx,P.vz));
  for(let k=0;k<n;k++){
    const pc=pieces[pieceHead=(pieceHead+1)%PIECES];
    pc.m.visible=true; pc.m.material=mats[Math.floor(Math.random()*mats.length)];
    const sc=(0.35+Math.random()*0.9)*scale;
    pc.m.scale.set(sc*(0.6+Math.random()),sc*(0.4+Math.random()*0.6),sc*(0.6+Math.random()));
    pc.m.position.set(x+(Math.random()-0.5)*spreadX,y+Math.random()*1.4,z+(Math.random()-0.5)*spreadZ);
    pc.m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    const side=(Math.random()<0.5?-1:1);
    pc.vx=dirx*6+(-dirz)*side*(3+Math.random()*7)+(Math.random()-0.5)*4;
    pc.vz=dirz*6+( dirx)*side*(3+Math.random()*7)+(Math.random()-0.5)*4;
    pc.vy=5+Math.random()*9;
    pc.ax=(Math.random()-0.5)*14; pc.ay=(Math.random()-0.5)*14; pc.az=(Math.random()-0.5)*14;
    pc.life=2.4; pc.rest=false;
  }
}
function smash(o){
  const mats=[];
  o.traverse(ch=>{ if(ch.isMesh&&mats.indexOf(ch.material)<0) mats.push(ch.material); });
  burst(o.position.x,o.position.y+0.6,o.position.z,mats,o.userData.h>2.5?18:12,2.5,3,1);
  o.visible=false;
}
function stepPieces(dt){
  for(const pc of pieces){
    if(!pc.m.visible) continue;
    pc.life-=dt;
    if(pc.life<=0){ pc.m.visible=false; continue; }
    if(!pc.rest){
      pc.vy-=24*dt;
      pc.m.position.x+=pc.vx*dt; pc.m.position.y+=pc.vy*dt; pc.m.position.z+=pc.vz*dt;
      pc.m.rotation.x+=pc.ax*dt; pc.m.rotation.y+=pc.ay*dt; pc.m.rotation.z+=pc.az*dt;
      const gh=H(pc.m.position.x,pc.m.position.z)+0.2;
      if(pc.m.position.y<gh){ pc.m.position.y=gh; pc.vy*=-0.35; pc.vx*=0.6; pc.vz*=0.6; pc.ax*=0.4; pc.ay*=0.4; pc.az*=0.4;
        if(Math.abs(pc.vy)<1.5) pc.rest=true; }
    }
    if(pc.life<0.5){ const k=pc.life/0.5; pc.m.scale.multiplyScalar(Math.pow(k,0.15)); }
  }
}

  for(let q=0;q<DECAL_QUADS;q++){const v=q*4,i=q*6;idx[i]=v;idx[i+1]=v+1;idx[i+2]=v+2;idx[i+3]=v;idx[i+4]=v+2;idx[i+5]=v+3;}
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  return geo;
}

function fillGround(c,z0){
  const pos=c.geo.attributes.position, col=c.geo.attributes.color, n=pos.count;
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=z0+pos.getZ(i)+CH_LEN*0.5;
    pos.setY(i,H(x,z));
  }
  pos.needsUpdate=true;
  c.geo.computeVertexNormals();
  c.geo.computeBoundingSphere();
  const nor=c.geo.attributes.normal;
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=z0+pos.getZ(i)+CH_LEN*0.5;
    const u=x-cx(z), au=Math.abs(u);
    const ny=Math.max(0.2,nor.getY(i));
    const slope=Math.sqrt(Math.max(0,1-ny*ny))/ny;
    const st=clamp((slope-0.16)/0.30,0,1);
    // 노이즈
    const n1=Math.sin(x*0.37+z*0.21)*Math.sin(x*0.11-z*0.29)*0.5+0.5;
    const n2=Math.sin(x*1.3+z*0.7)*0.5+0.5;
    let r,g,b;
    const road=smooth((ROAD_HALF+0.8-au)/1.6);           // 1=아스팔트
    // 아스팔트: 회색, 균열·먼지
    const crack=Math.pow(Math.sin(x*0.9+z*1.7)*Math.sin(x*0.35-z*0.8)*0.5+0.5,6.0);
    let ar=0.47+n1*0.10-crack*0.18+st*0.12, ag=0.45+n1*0.09-crack*0.18+st*0.11, ab=0.49+n1*0.07-crack*0.16+st*0.10;
    // 중앙분리대 자갈
    const med=smooth((MED+0.5-au)/0.8);
    ar=lerp(ar,0.66+n2*0.08,med); ag=lerp(ag,0.60+n2*0.07,med); ab=lerp(ab,0.50+n2*0.05,med);
    // 흙: 황토 + 마른풀 얼룩
    const grass=smooth(n1*1.6-0.5);
    let dr=lerp(0.82,0.66,grass)+n2*0.05, dg=lerp(0.68,0.62,grass)+n2*0.04, db=lerp(0.47,0.30,grass)+n2*0.02;
    dr-=st*0.16; dg-=st*0.14; db-=st*0.10;
    r=lerp(dr,ar,road); g=lerp(dg,ag,road); b=lerp(db,ab,road);
    col.setXYZ(i,Math.pow(r,2.2),Math.pow(g,2.2),Math.pow(b,2.2));
  }
  col.needsUpdate=true;
  c.mesh.position.set(0,0,z0+CH_LEN*0.5);
}

function fillDecal(c,z0){
  const geo=c.decal.geometry, pos=geo.attributes.position, col=geo.attributes.color, nor=geo.attributes.normal;
  let q=0;
  const quad=(p0,p1,p2,p3,color)=>{
    if(q>=DECAL_QUADS) return;
    const v=q*4;
    const pts=[p0,p1,p2,p3];
    for(let k=0;k<4;k++){pos.setXYZ(v+k,pts[k][0],pts[k][1],pts[k][2]);col.setXYZ(v+k,color[0],color[1],color[2]);nor.setXYZ(v+k,0,1,0);}
    q++;
  };
  // 도로면 위에 얇은 띠 (u0..u1) — 세로 분할
  const strip=(u0,u1,color,zA,zB,step,lift)=>{
    for(let z=zA;z<zB;z+=step){
      const z2=Math.min(zB,z+step);
      const c1=cx(z), c2=cx(z2);
      const y1=H(c1+u0,z)+lift, y2=H(c1+u1,z)+lift, y3=H(c2+u1,z2)+lift, y4=H(c2+u0,z2)+lift;
      quad([c1+u0,y1,z],[c1+u1,y2,z],[c2+u1,y3,z2],[c2+u0,y4,z2],color);
    }
  };
  // 세워진 띠 (가드레일)
  const fence=(u,color,h0,h1,zA,zB,step)=>{
    for(let z=zA;z<zB;z+=step){
      const z2=Math.min(zB,z+step);
      const c1=cx(z), c2=cx(z2);
      const y1=H(c1+u,z), y2=H(c2+u,z2);
      quad([c1+u,y1+h0,z],[c1+u,y1+h1,z],[c2+u,y2+h1,z2],[c2+u,y2+h0,z2],color);
    }
  };
  const zA=z0, zB=z0+CH_LEN;
  // 바깥 실선(흰), 안쪽 실선(노랑)
  strip( RAIL-0.55, RAIL-0.35, CLR.white, zA,zB,3,0.03);
  strip(-RAIL+0.35,-RAIL+0.55, CLR.white, zA,zB,3,0.03);
  strip( MED+0.30, MED+0.50, CLR.yellow, zA,zB,3,0.03);
  strip(-MED-0.50,-MED-0.30, CLR.yellow, zA,zB,3,0.03);
  // 차로 점선
  for(let z=zA;z<zB;z+=6){ strip( 6.8, 6.98, CLR.white, z,z+2.6,2.6,0.03); strip(-6.98,-6.8, CLR.white, z,z+2.6,2.6,0.03); }
  // 중앙분리대 연석
  strip(-MED,-MED+0.35, CLR.curb, zA,zB,3,0.10);
  strip( MED-0.35, MED, CLR.curb, zA,zB,3,0.10);
  // 가드레일: 판 + 기둥
  for(const s of[-1,1]){
    fence(s*(RAIL+0.55), CLR.rail, 0.45,0.78, zA,zB,3);
    for(let z=zA+1;z<zB;z+=4){
      const cc=cx(z), y=H(cc+s*(RAIL+0.55),z);
      const u=cc+s*(RAIL+0.55);
      quad([u-0.07,y,z-0.07],[u-0.07,y+0.8,z-0.07],[u+0.07,y+0.8,z+0.07],[u+0.07,y,z+0.07],CLR.post);
      quad([u+0.07,y,z-0.07],[u+0.07,y+0.8,z-0.07],[u-0.07,y+0.8,z+0.07],[u-0.07,y,z+0.07],CLR.post);
    }
  }
  geo.setDrawRange(0,q*6);
  pos.needsUpdate=true; col.needsUpdate=true; nor.needsUpdate=true;
}

function makeParticles(n,color,size,opacity){

function emit(ps,x,y,z,vx,vy,vz,spread,count,lifeS){
  for(let k=0;k<count;k++){
    const i=ps.head=(ps.head+1)%ps.n, i3=i*3;
    ps.pos[i3]=x+(Math.random()-0.5)*0.6; ps.pos[i3+1]=y; ps.pos[i3+2]=z+(Math.random()-0.5)*0.6;
    ps.vel[i3]=vx+(Math.random()-0.5)*spread; ps.vel[i3+1]=vy+Math.random()*spread; ps.vel[i3+2]=vz+(Math.random()-0.5)*spread;
    ps.life[i]=lifeS*(0.6+Math.random()*0.6);
  }
}
function stepParticles(ps,dt){
  for(let i=0;i<ps.n;i++){
    if(ps.life[i]<=0){ ps.pos[i*3+1]=-9999; continue; }
    ps.life[i]-=dt; const i3=i*3;
    ps.vel[i3+1]-=ps.grav*dt;
    ps.pos[i3]+=ps.vel[i3]*dt; ps.pos[i3+1]+=ps.vel[i3+1]*dt; ps.pos[i3+2]+=ps.vel[i3+2]*dt;
  }
  ps.geo.attributes.position.needsUpdate=true;
}
function clearParticles(ps){ for(let i=0;i<ps.n;i++){ps.life[i]=0;ps.pos[i*3+1]=-9999;} ps.geo.attributes.position.needsUpdate=true; }

  if(P.inv>0) return;
  const lift=P.ground?0:(P.y-H(P.x,P.z));      // 공중이면 낮은 것은 넘어간다
  for(const c of chunks){
    if(Math.abs(c.z0+CH_LEN*0.5-P.z)>CH_LEN*1.2) continue;

    for(const o of c.obs){
      if(!o.visible) continue;
      if(lift>(o.userData.h||1.5)+(o.rotation.z!==0?0.9:0)) continue;
      const dz0=o.position.z-P.z; if(dz0<-12||dz0>14) continue;
      const cy=Math.cos(o.rotation.y), sy=Math.sin(o.rotation.y);
      for(const h of o.userData.hits){
        const wx=o.position.x+h.x*cy+h.z*sy, wz=o.position.z-h.x*sy+h.z*cy;
        const dx=wx-P.x, dz=wz-P.z, rr=h.r+0.55;
        if(dx*dx+dz*dz<rr*rr){

          crash(false); return;

  }

function physics(dt){
  P.steer =lerp(P.steer ,P.steerT ,clamp(7*dt,0,1));
  P.crouch=lerp(P.crouch,P.crouchT,clamp(16*dt,0,1));
  if(P.spin>0){ P.spin=Math.max(0,P.spin-dt*1.2); }

  const g=grad(P.x,P.z);
  let sp=Math.hypot(P.vx,P.vz);
  const steerEff=P.spin>0?0:P.steer;

  if(P.ground){
    const tuck=1+P.crouch*0.12;
    P.vx += -g.x*G*dt*tuck;
    P.vz += -g.z*G*dt*tuck;
    sp=Math.hypot(P.vx,P.vz);
    if(sp>0.5){
    const steerEase=lerp(0.78,1.0,difficultyAt(P.z));

const rate=
  (1.75-0.7*clamp(sp/MAXV,0,1))*
  steerEff*
  steerEase*
  dt/
  (1+P.pallets*0.035);
      const c=Math.cos(rate),s=Math.sin(rate);
      const nx=P.vx*c-P.vz*s, nz=P.vx*s+P.vz*c; P.vx=nx;P.vz=nz;
    }
    // 핸들 꺾으면 바퀴가 긁혀 느려진다
    const st=Math.abs(steerEff);
    if(st>0.06){
      const drag=st*sp*0.16*dt;
      const f=Math.max(0,1-drag/Math.max(sp,0.01)); P.vx*=f;P.vz*=f;
    }
    // 전복 게이지: 빠를 때 세게 꺾으면 찬다
    const risk=
  st*
  clamp((sp-13)/30,0,1)*
  (1+P.pallets*0.09)*
  difficultyAt(P.z);
    if(risk>0.2) P.tipMeter=Math.min(1,P.tipMeter+dt*risk*TIP_RATE);
    else P.tipMeter=Math.max(0,P.tipMeter-dt*1.1);
    if(P.tipMeter>=1&&P.inv<=0){ crash(true); }
    // 구름 저항
    const fr=(0.55-P.crouch*0.15)*dt;
    const f2=Math.max(0,1-fr/Math.max(sp,0.01)); P.vx*=f2;P.vz*=f2;
    // 먼지: 급선회/비포장
    const u=P.x-cx(P.z);
    if((st>0.35&&sp>8)||(Math.abs(u)>ROAD_HALF-0.5&&sp>4))
      emit(dust,P.x,P.y+0.05,P.z,-P.vx*0.12,1.4,-P.vz*0.12,3.5,2,0.7);
  }else{
    P.air+=dt;
    if(sp>0.5){
      const rate=0.5*steerEff*dt;
      const c=Math.cos(rate),s=Math.sin(rate);
      const nx=P.vx*c-P.vz*s, nz=P.vx*s+P.vz*c; P.vx=nx;P.vz=nz;
    }
  }
  // 공기 저항 (웅크리면 크게 준다)
  sp=Math.hypot(P.vx,P.vz);
  const air=0.0062*sp*sp*dt*(1-P.crouch*0.38)/(1+P.pallets*0.025);
  const fa=Math.max(0,1-air/Math.max(sp,0.01)); P.vx*=fa;P.vz*=fa;

  if(P.vz<0.8) P.vz=0.8;
  sp=Math.hypot(P.vx,P.vz);
  if(sp>MAXV){const k=MAXV/sp;P.vx*=k;P.vz*=k;sp=MAXV;}
  P.top=Math.max(P.top,sp);

  P.x+=P.vx*dt; P.z+=P.vz*dt;

  // 가드레일: 단단한 벽. 처음 부딪힐 때 한 번 잃고, 긁는 동안은 조금씩 잃는다
  const uNow=P.x-cx(P.z);
  if(Math.abs(uNow)>RAIL-0.35){
    const side=Math.sign(uNow);
    P.x=cx(P.z)+side*(RAIL-0.35);
    const tx=cxSlope(P.z), tz=1, tl=Math.hypot(tx,tz);
    const dx=tx/tl, dz=tz/tl;
    const along=P.vx*dx+P.vz*dz;
    const normal=P.vx*dz-P.vz*dx;
    P.vx=along*dx; P.vz=along*dz;
    if(!P.onRail){
      const impact=clamp(Math.abs(normal)*0.03,0,0.5);
      P.vx*=1-impact; P.vz*=1-impact;
      P.shake=Math.max(P.shake,impact);
    }
    const scrapeF=Math.max(0,1-0.45*dt);
    P.vx*=scrapeF; P.vz*=scrapeF;
    P.onRail=true; P.scrape=0.12;
    if(sp>5) emit(sparks,P.x+side*0.3,P.y+0.35,P.z,-P.vx*0.25+side*2,2.5,-P.vz*0.25,4,3,0.35);
  }else P.onRail=false;

  // 수직
  const gn=grad(P.x,P.z);
  const hh=H(P.x,P.z);
  const follow=gn.x*P.vx+gn.z*P.vz;
  if(P.ground){
    P.y=hh; P.vy=follow;
    if(P.jump){ P.vy+=P.jumpImpulse; P.ground=false; P.air=0; SFX.jump(sp,true); }
    else{
      const T=0.06;

function applyPose(dt){

  body.position.y = lerp(body.position.y, -0.02 * t + stackH * (1 - t), k);

  // 정면에 가깝되 살짝만 틀어서 3/4

  body.rotation.x = lerp(body.rotation.x, 0.03 * t + 0.16 * (1 - t), k);

    legs[0].position.y = lerp(legs[0].position.y, 0.95, k);
    legs[0].position.z = lerp(legs[0].position.z, -0.30, k);

    // 오른발: 바닥 지지
    legs[1].rotation.x = lerp(legs[1].rotation.x, 0.10 * t, k);
    knees[1].rotation.x = lerp(knees[1].rotation.x, 0.10 * t, k);
    legs[1].rotation.z = lerp(legs[1].rotation.z, 0.08 * t, k);
    legs[1].position.y = lerp(legs[1].position.y, 0.95, k);
    legs[1].position.z = lerp(legs[1].position.z, -0.40, k);

    // 왼손: 손잡이
    arms[0].rotation.x = lerp(arms[0].rotation.x, -1.00 * t + (-1.45) * (1 - t), k);

const camTmp=new THREE.Vector3();
let camYaw=0, camX=0, camInit=false;
let introT=0;


function introCamera(dt){
  introT += dt;

  const sx = Math.sin(introT * 0.25) * 0.06;
  const sy = Math.cos(introT * 0.31) * 0.03;
  const portrait = camera.aspect < 1;

  if(portrait){
    // 앞쪽에서 보는 구도
    camTmp.set(P.x + 1.35 + sx, P.y + 1.22 + sy, P.z + 4.65);
    camera.lookAt(P.x + 0.00, P.y + 0.96, P.z - 0.05);
  }else{
    camTmp.set(P.x + 1.55 + sx, P.y + 1.02 + sy, P.z + 3.95);
    camera.lookAt(P.x + 0.02, P.y + 0.98, P.z - 0.08);
  }

  camera.position.lerp(camTmp, clamp(4 * dt, 0, 1));
  camera.lookAt(P.x + 0.01, P.y + (portrait ? 0.96 : 0.98), P.z - 0.06);

  const fovT = portrait ? 56 : 50;
  if(Math.abs(camera.fov - fovT) > 0.05){
    camera.fov = lerp(camera.fov, fovT, clamp(4 * dt, 0, 1));
    camera.updateProjectionMatrix();
  }

  const e = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");
  bgU.uYaw.value = e.y;
  bgU.uPitch.value = clamp(-e.x * 0.55, -0.3, 0.3);
}


function updateCamera(dt,sp){
  if(!running&&poseT>0.5){ introCamera(dt); return; }
  const roadYaw=Math.atan2(cxSlope(P.z+12),1);
  const heading=Math.atan2(P.vx,P.vz);
  // 도로 방향 85% + 진행 방향 15%, 천천히 따라간다
  let targetYaw=roadYaw*0.9+heading*0.1;
  if(!camInit){ camYaw=targetYaw; camX=P.x; camInit=true; }
  let dy=targetYaw-camYaw; while(dy>Math.PI)dy-=2*Math.PI; while(dy<-Math.PI)dy+=2*Math.PI;
  camYaw+=dy*clamp(2.2*dt,0,1);
  camX=lerp(camX,P.x,clamp(3.0*dt,0,1));            // 좌우는 느리게 따라붙는다
  const dist=6.6+stackH*0.45, hgt=3.0+stackH*0.7;
  camTmp.set(camX-Math.sin(camYaw)*dist, P.y+hgt, P.z-Math.cos(camYaw)*dist);
  camera.position.lerp(camTmp,clamp(10*dt,0,1));
  const floor=H(camera.position.x,camera.position.z)+1.6;
  if(camera.position.y<floor)camera.position.y=floor;
  if(P.shake>0){ const sh=P.shake*0.28; camera.position.x+=(Math.random()-0.5)*sh; camera.position.y+=(Math.random()-0.5)*sh; }
  const look=9;
  camera.lookAt(camX+Math.sin(camYaw)*look, P.y+1.0+stackH*0.75, P.z+Math.cos(camYaw)*look);
  const fov=66+P.boost*5;
  if(Math.abs(camera.fov-fov)>0.05){camera.fov=lerp(camera.fov,fov,clamp(5*dt,0,1));camera.updateProjectionMatrix();}
  const e=new THREE.Euler().setFromQuaternion(camera.quaternion,"YXZ");
  bgU.uYaw.value=e.y; bgU.uPitch.value=clamp(-e.x*0.55,-0.3,0.3);
}

const stickEl=document.getElementById("stick");

const RAD=74;
function stickStart(x,y){
  sx=x;sy=y;tStart=performance.now();moved=false;
  stickEl.style.left=x+"px";stickEl.style.top=y+"px";
  stickEl.classList.add("on"); nubEl.style.transform="translate(0,0)";

function stickMove(x,y){

  nubEl.style.transform="translate("+dx+"px,"+dy+"px)";

  P.crouchT=clamp(dy/RAD,0,1);
}



function stickEnd(){
  stickEl.classList.remove("on");
  touchId=null;

  const quickTap =
    !moved &&
    performance.now()-tStart < 220;

  if(quickTap){
    // 짧은 탭은 오직 발 구르기
    kick();
    P.hold=0;
  }else{
    // 아래로 당겼다가 놓은 경우만 점프

let actx=null,muted=false,master=null,comp=null,noiseBuf=null;
let rumble=null,wind=null,scrape=null,creak=null,crackleT=0;
function mkNoise(){
  const len=actx.sampleRate*2, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return buf;
}
function loop(type,freq,q){                       // 연속음 채널: 노이즈 → 필터 → 게인
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=actx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
  const g=actx.createGain(); g.gain.value=0;
  src.connect(f); f.connect(g); g.connect(master); src.start();
  return {f:f,g:g};
}
function audioStart(){
  if(actx){ if(actx.state==="suspended") actx.resume(); return; }
  if(muted) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=mkNoise();
    comp=actx.createDynamicsCompressor();
    comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.16;
    master=actx.createGain(); master.gain.value=0.9;
    master.connect(comp); comp.connect(actx.destination);
    rumble=loop("lowpass",120);                    // 바퀴 구름
    wind=loop("bandpass",900,0.6);                 // 바람
    scrape=loop("bandpass",2600,7);                // 가드레일 긁힘
    // 긁힘 배음: 톱니파 + 비브라토
    const so=actx.createOscillator(); so.type="sawtooth"; so.frequency.value=1750;
    const lfo=actx.createOscillator(); lfo.frequency.value=6.5; const lg=actx.createGain(); lg.gain.value=40;
    lfo.connect(lg); lg.connect(so.frequency); lfo.start();
    const sf=actx.createBiquadFilter(); sf.type="bandpass"; sf.frequency.value=2200; sf.Q.value=3;
    scrape.tone=actx.createGain(); scrape.tone.gain.value=0;
    so.connect(sf); sf.connect(scrape.tone); scrape.tone.connect(master); so.start();
    // 전복 경고: 낮은 삐걱임
    const co=actx.createOscillator(); co.type="sawtooth"; co.frequency.value=52;
    const cl=actx.createOscillator(); cl.frequency.value=2.3; const clg=actx.createGain(); clg.gain.value=10;
    cl.connect(clg); clg.connect(co.frequency); cl.start();
    const cf=actx.createBiquadFilter(); cf.type="lowpass"; cf.frequency.value=380;
    creak={g:actx.createGain()}; creak.g.gain.value=0;
    co.connect(cf); cf.connect(creak.g); creak.g.connect(master); co.start();
  }catch(e){actx=null;}
}
/* ---- 원샷 부품 ---- */
function env(g,t,a,peak,d,curve){                 // 어택 → 피크 → 감쇠
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  if(curve==="lin") g.gain.linearRampToValueAtTime(0.0001,t+a+d);
  else g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
}
function tone(t,type,f0,f1,dur,peak,a,out){       // 오실레이터 한 방
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  env(g,t,a||0.003,peak,dur);
  o.connect(g); g.connect(out||master); o.start(t); o.stop(t+dur+0.05);
  return o;
}
function hiss(t,ftype,f0,f1,q,dur,peak,a,out){    // 노이즈 한 방
  const src=actx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  src.playbackRate.value=0.7+Math.random()*0.6;
  const f=actx.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(f0,t);
  if(f1!==f0) f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  f.Q.value=q||1;
  const g=actx.createGain(); env(g,t,a||0.003,peak,dur);
  src.connect(f); f.connect(g); g.connect(out||master); src.start(t); src.stop(t+dur+0.05);
}
function ring(t,freq,dur,peak,detune){            // 금속 울림: 배음 두 겹 + 미세 디튠
  for(const [m,k] of[[1,1],[2.76,0.45],[5.4,0.2]]){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="triangle"; o.frequency.value=freq*m; o.detune.value=(detune||0)+(Math.random()-0.5)*12;
    env(g,t,0.002,peak*k,dur*(1-0.25*(m-1)/4.4));
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
  }
}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36];
function marimba(t,freq,dur,peak){                // 나무/플라스틱 타악 음
  tone(t,"sine",freq,freq,dur,peak,0.002);
  tone(t,"sine",freq*3.9,freq*3.9,dur*0.35,peak*0.35,0.002);
  hiss(t,"bandpass",freq*4,freq*4,4,0.03,peak*0.6,0.001);
}
function now(){ return actx.currentTime+0.005; }

/* ---- 효과음 사전 ---- */
const SFX={
  ok:function(){ return !!actx&&!muted; },
  kick:function(push){ if(!this.ok())return; const t=now();
    hiss(t,"bandpass",1300,500,1.2,0.14,push?0.55:0.35,0.004);          // 신발이 아스팔트 긁는 소리
    tone(t,"sine",95,48,0.09,push?0.5:0.25,0.002);                        // 발 구르는 저음
    if(push) hiss(t+0.05,"highpass",3000,3000,1,0.08,0.12,0.01); },
  seam:function(sp){ if(!this.ok())return; const t=now(); const k=clamp(sp/40,0.3,1);
    tone(t,"sine",150,90,0.035,0.16*k,0.001); hiss(t,"bandpass",700,700,3,0.02,0.10*k,0.001);
    tone(t+0.06,"sine",140,85,0.03,0.11*k,0.001); },
  pallet:function(n){ if(!this.ok())return; const t=now();
    hiss(t,"bandpass",2400,1600,3,0.05,0.45,0.001);                       // 플라스틱 딱
    hiss(t+0.07,"bandpass",1800,1200,3,0.05,0.35,0.001);
    tone(t,"sine",210,150,0.12,0.3,0.002);
    const f=330*Math.pow(2,PENTA[(n-1)%PENTA.length]/12);                 // 쌓을수록 음이 올라간다
    marimba(t+0.08,f,0.45,0.5); marimba(t+0.16,f*1.5,0.35,0.28); },
  baton:function(){ if(!this.ok())return; const t=now();
    [880,1108.7,1318.5,1760].forEach((f,i)=>{ tone(t+i*0.07,"sine",f,f,0.35,0.34,0.003); tone(t+i*0.07,"triangle",f*2,f*2,0.18,0.08,0.003); });
    hiss(t,"highpass",6000,9000,1,0.4,0.12,0.02); },
  tick:function(fast){ if(!this.ok())return; const t=now(); tone(t,"square",fast?1900:1500,fast?1900:1500,0.035,0.06,0.001); },
  smash:function(big){ if(!this.ok())return; const t=now(); const k=big?1.3:1;
    tone(t,"sine",120*k,32,0.45,1.0,0.002);                                // 붐
    tone(t,"triangle",70,40,0.25,0.5,0.002);
    hiss(t,"lowpass",7000,300,0.7,0.6,0.9,0.002);                          // 콰직
    hiss(t+0.02,"bandpass",1800,900,1,0.25,0.6,0.002);
    ring(t+0.01,620*(big?0.8:1),0.7,0.22,0); ring(t+0.03,940*(big?0.8:1),0.5,0.14,15);   // 쇳소리
    for(let i=0;i<7;i++){ const d=0.05+Math.random()*0.35; hiss(t+d,"highpass",5000+Math.random()*4000,7000,2,0.05,0.16,0.001); }   // 유리 파편
    for(let i=0;i<3;i++) tone(t+0.25+i*0.13,"triangle",300-i*60,180-i*40,0.09,0.15,0.002); },   // 굴러 떨어지는 부품
  crash:function(){ if(!this.ok())return; const t=now();
    tone(t,"sine",85,28,0.28,0.85,0.002); hiss(t,"bandpass",900,400,1,0.2,0.6,0.002);
    tone(t+0.01,"triangle",1500,900,0.08,0.3,0.001); hiss(t+0.1,"lowpass",2500,500,1,0.3,0.3,0.01); },
  shield:function(wipe){ if(!this.ok())return; const t=now();       // 파렛트가 대신 깨진다
    tone(t,"sine",160,90,0.18,0.5,0.002);
    [[0,2000],[0.05,1400],[0.11,2500],[0.19,1100]].forEach(([d,f])=>hiss(t+d,"bandpass",f,f*0.7,3,0.06,0.5,0.001));
    marimba(t+0.02,392,0.2,0.3); marimba(t+0.13,262,0.3,0.28);
    if(wipe) marimba(t+0.26,196,0.35,0.25); },
  wipeout:function(){ if(!this.ok())return; const t=now();
    [[0,1],[0.13,0.8],[0.28,0.65],[0.46,0.5]].forEach(([d,k])=>{ tone(t+d,"sine",80,30,0.22,0.8*k,0.002); hiss(t+d,"bandpass",800,300,1,0.15,0.45*k,0.002); });
    hiss(t,"bandpass",700,250,1,0.7,0.35,0.05);
    for(let i=0;i<4;i++) hiss(t+0.5+i*0.09,"bandpass",2000,1500,3,0.04,0.2,0.001); },   // 자키 덜그럭
  jump:function(sp,hop){ if(!this.ok())return; const t=now(); const k=clamp(sp/40,0.3,1);
    hiss(t,"bandpass",400,2600,1,0.35,0.7*k,0.02);                         // 훅
    if(hop){ tone(t,"sine",180,320,0.12,0.15,0.005); } },
  land:function(mis,pal){ if(!this.ok())return; const t=now();
    tone(t,"sine",75,38,0.16,0.35+0.5*mis,0.002); hiss(t,"highpass",3000,3000,1,0.03,0.3,0.001);   // 포크 착지
    hiss(t+0.01,"bandpass",600,300,1,0.15,0.25+0.4*mis,0.002);
    for(let i=0;i<Math.min(pal,4);i++) hiss(t+0.03+i*0.05,"bandpass",1500+i*300,1200,3,0.05,0.25,0.001); },   // 파렛트 덜컹
  clean:function(){ if(!this.ok())return; const t=now();
    hiss(t,"highpass",2000,4000,1,0.22,0.16,0.01); tone(t,"triangle",600,1200,0.14,0.14,0.005); },
  cone:function(){ if(!this.ok())return; const t=now();
    tone(t,"sine",330,240,0.13,0.4,0.002); hiss(t,"bandpass",1000,700,2,0.04,0.3,0.001); tone(t+0.09,"sine",260,200,0.1,0.15,0.002); },
  start:function(){ if(!this.ok())return; const t=now();
    hiss(t,"bandpass",1200,1200,4,0.03,0.3,0.001); hiss(t+0.09,"bandpass",900,900,4,0.03,0.3,0.001);
    hiss(t+0.2,"bandpass",300,2500,1,0.6,0.2,0.05); },
  gameOver:function(){ if(!this.ok())return; const t=now();
    [523,392,294].forEach((f,i)=>{ tone(t+i*0.2,"triangle",f,f,0.22,0.28,0.005); tone(t+i*0.2,"sine",f/2,f/2,0.24,0.18,0.005); });
    tone(t+0.62,"sine",70,40,0.4,0.4,0.002); },
  best:function(){ if(!this.ok())return; const t=now();
    [523,659,784,1047].forEach((f,i)=>{ const d=i===3?0.5:0.14; tone(t+i*0.13,"triangle",f,f,d,0.3,0.004); tone(t+i*0.13,"sine",f*2,f*2,d*0.6,0.1,0.004); });
    hiss(t+0.4,"highpass",5000,8000,1,0.5,0.1,0.05); }
};
/* ---- 연속음 ---- */
function audioUpdate(sp,dt){
  if(!actx||muted)return;
  const n=clamp(sp/MAXV,0,1);
  rumble.g.gain.value=(P.ground?1:0.12)*(0.02+n*0.10)*(running?1:0);
  rumble.f.frequency.value=90+n*280;
  wind.g.gain.value=(0.004+n*n*0.07)*(running?1:0);
  wind.f.frequency.value=500+n*1500;
  const sc=(P.scrape>0&&running)?clamp(sp/30,0.2,1):0;
  scrape.g.gain.value=lerp(scrape.g.gain.value,sc*0.22,0.4);
  scrape.tone.gain.value=lerp(scrape.tone.gain.value,sc*0.05,0.4);
  if(sc>0){ crackleT-=dt; if(crackleT<=0){ crackleT=0.02+Math.random()*0.06; const t=now(); hiss(t,"highpass",4000+Math.random()*4000,6000,2,0.02,0.18*sc,0.001); } }
  const cr=running&&P.ground?clamp((P.tipMeter-0.55)/0.45,0,1):0;
  creak.g.gain.value=lerp(creak.g.gain.value,cr*0.16,0.2);
}
document.getElementById("sound").addEventListener("click",function(){
  muted=!muted; this.textContent=muted?"—":"♪";
  if(master) master.gain.value=muted?0:0.9;
  if(!muted) audioStart();
});

/* ==================================================================
   12. 흐름
   ================================================================== */
const introEl=document.getElementById("intro");
const overEl=document.getElementById("over");
function start(){
  reset();
  introEl.classList.add("hide"); overEl.classList.add("hide");
  hudEl.classList.add("on");
  running=true; introPallet.visible=false;
  camInit=false;
  audioStart(); SFX.start();
  seamZ=0;
}
let lastResult=null, seamZ=0;
let poseT=1;                                      // 1=인트로 포즈, 0=주행 자세
function finish(){
  running=false; P.alive=false;
  const isBest=Math.round(P.dist)>best&&best>0;
  best=Math.max(best,Math.round(P.dist));
  SFX.gameOver(); if(isBest) setTimeout(function(){SFX.best();},700);
  try{ localStorage.setItem("jockey_best",String(best)); }catch(e){}
  const d=new Date();
  const date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  lastResult={game:GAME_ID,kind:"run",version:VERSION,seed:SEED,score:Math.round(P.dist),dist:Math.round(P.dist),
    top:Math.round(P.top*3.6),pallets:P.palMax,elapsed:Math.round((performance.now()-P.t0)/100)/10,date:date};
  window.JOCKEY_RESULT=lastResult;
  try{ if(typeof window.onJockeyFinish==="function") window.onJockeyFinish(lastResult); }catch(e){}
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:"jockey-result",result:lastResult},"*"); }catch(e){}
  document.getElementById("rDist").textContent=Math.round(P.dist);
  document.getElementById("rPal").textContent=P.palMax;
  document.getElementById("rBest").textContent=best;
  rankEl.className=RANK_URL?"rank on":"rank"; rankMsg.textContent=""; submitBtn.disabled=false;
  boardEl.innerHTML=""; loadBoard();
  hudEl.classList.remove("on"); powEl.className="pow";
  overEl.classList.remove("hide");
  stickEl.classList.remove("on"); touchId=null; P.steerT=0; P.crouchT=0;
}
const rankEl=document.getElementById("rank"), rankMsg=document.getElementById("rankmsg"),
      nickEl=document.getElementById("nick"), submitBtn=document.getElementById("submit");
try{ nickEl.value=localStorage.getItem("jockey_nick")||""; }catch(e){}
submitBtn.addEventListener("click",function(){
  if(!lastResult||!RANK_URL) return;
  const name=nickEl.value.trim(); if(!name){ nickEl.focus(); return; }
  try{ localStorage.setItem("jockey_nick",name); }catch(e){}
  submitBtn.disabled=true;
  const body=JSON.stringify(Object.assign({name:name},lastResult));
  fetch(RANK_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body,keepalive:true})
    .then(function(){ rankMsg.textContent="등록됨"; setTimeout(loadBoard,1200); })
    .catch(function(){ rankMsg.textContent="등록됨"; setTimeout(loadBoard,1200); });   // no-cors 환경에서도 실제로는 저장된다
});
/* 순위표 조회 (JSONP) */
const boardEl=document.getElementById("board");
function loadBoard(){
  if(!RANK_URL) return;
  const fn="jockeyCb"+Date.now().toString(36);
  const sc=document.createElement("script");
  let done=false;
  const cleanup=function(){ try{delete window[fn];}catch(e){window[fn]=undefined;} if(sc.parentNode) sc.parentNode.removeChild(sc); };
  window[fn]=function(d){ if(done) return; done=true; cleanup(); renderBoard(d); };
  sc.onerror=function(){ if(done) return; done=true; cleanup(); };
  sc.src=RANK_URL+(RANK_URL.indexOf("?")>=0?"&":"?")+"game="+GAME_ID+"&callback="+fn+"&t="+Date.now();
  document.head.appendChild(sc);
  setTimeout(function(){ if(!done){done=true;cleanup();} },6000);
}
function renderBoard(d){
  let list=null;
  if(Array.isArray(d)) list=d;
  else if(d&&typeof d==="object"){ for(const k of["jockey","runs","run","records","list","certs"]){ if(Array.isArray(d[k])){list=d[k];break;} } }
  if(!list||!list.length){ boardEl.innerHTML=""; return; }
  const rows=list.map(function(r){ return {name:String(r.name||"").slice(0,12),score:Number(r.score!=null?r.score:(r.dist!=null?r.dist:(r.total!=null?r.total:0)))||0,pallets:r.pallets}; })
    .filter(function(r){ return r.name; })
    .sort(function(a,b){ return b.score-a.score; }).slice(0,10);
  const esc=function(t){ return String(t).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  boardEl.innerHTML="<table>"+rows.map(function(r,i){ return "<tr><td>"+(i+1)+"</td><td>"+esc(r.name)+"</td><td class=\"num\">"+r.score+" m</td>"+
    "<td class=\"num\">"+(r.pallets!=null?r.pallets+"단":"")+"</td></tr>"; }).join("")+"</table>";
}
nickEl.addEventListener("keydown",function(e){ e.stopPropagation(); if(e.key==="Enter") submitBtn.click(); });
document.getElementById("go").addEventListener("click",start);
document.getElementById("again").addEventListener("click",start);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  bgU.uAspect.value=w/h;
}
addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,120));
resize();

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  const sp0=Math.hypot(P.vx,P.vz);
  if(running){
    if(P.crouchT>0.5)P.hold=Math.min(0.6,P.hold+dt);
    physics(dt); recycle(); hitTest(); pickupTest(); coneTest();
    if(P.power>0){ const before=P.power; P.power-=dt; const step=P.power<2?0.25:0.5;
      if(Math.floor(before/step)!==Math.floor(P.power/step)) SFX.tick(P.power<2); }
    // 고속도로 이음새: 18m 마다 톡
    if(P.ground&&sp0>7&&P.z-seamZ>18){ seamZ=P.z; SFX.seam(sp0); }
  }
  stepPieces(dt);
  const sp=Math.hypot(P.vx,P.vz);
  stepParticles(dust,dt); stepParticles(sparks,dt);
  animateRider(dt,sp);
  if(!window.__freeCam) updateCamera(dt,sp);
  if(running)updateHud(dt,sp);
  audioUpdate(running?sp:0,dt);
  renderer.clear();
  renderer.render(bgScene,bgCam);
  renderer.clearDepth();
  renderer.render(scene,camera);
}
reset(); P.alive=false;
camera.position.set(P.x,H(P.x,0)+4.5,-10);
requestAnimationFrame(frame);

window.__game={P:P,start:start,H:H,cx:cx,cam:camera,rider:rider,SFX:SFX,actxState:function(){return actx?actx.state:'none';},master:function(){return master;},ctx:function(){return actx;},snapCam:function(){camInit=false;},setStack:function(n){for(let i=0;i<n;i++) if(!stackKinds[i]) stackKinds[i]=hash1(i*5.3)<0.5?"aj":"kpp"; setStack(n);},finish:finish,
  sim:function(dt,n){const out=[];for(let i=0;i<n;i++){physics(dt);recycle();hitTest();pickupTest();
    if(i%Math.floor(n/12||1)===0)out.push({t:+(i*dt).toFixed(1),v:+(Math.hypot(P.vx,P.vz)*3.6).toFixed(0),
      u:+(P.x-cx(P.z)).toFixed(0),z:+P.z.toFixed(0),air:P.ground?0:1,hit:P.hits});}return out;}};
})();
</script>
